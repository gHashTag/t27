[package]
name = "t27-lsp"
version = "0.1.0"
edition = "2021"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.0"
log = "0.4"
env_logger = "0.11"
tree-sitter = "0.24"
tree-sitter-t27 = { path = "../tree-sitter-t27" }
regex = "1.11"
once_cell = "1.20"
paths = "0.4"

[dev-dependencies]
tower-lsp = { version = "0.20", features = ["proposed"] }