# Default gitleaks configuration plus hardcoded-password-literal for Wi-Fi passphrases
title = "gitleaks"

[allowlist]
description = "Global allowlist"
paths = [
    "test.*",
    ".*\\.test\\..*",
    ".*\\.spec\\..*",
    "node_modules",
    "dist",
    "build",
    "target",
    ".*\\.min\\.js",
    ".*\\.min\\.css",
    ".*\\.woff",
    ".*\\.woff2",
    ".*\\.ttf",
    ".*\\.png",
    ".*\\.jpg",
    ".*\\.jpeg",
    ".*\\.gif",
    ".*\\.svg",
    ".*\\.ico"
]

[[rules]]
id = "api-key"
description = "API key"
regex = '''(?i)(api_key|apikey|access[_-]?key|secret[_-]?key|client[_-]?secret|consumer[_-]?key|token|bearer)[\"'`_\\s]*[:=][\"'`_\\s]*[a-z0-9_\\-]{10,}'''
entropy = 3.5
keywords = ["api_key", "apikey", "access_key", "secret_key", "client_secret", "consumer_key", "token", "bearer"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
keywords = ["AKIA", "A3T", "AGPA", "AROA", "AIPA", "ANPA", "ANVA", "ASIA"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Key"
regex = '''(?i)aws[_-]?secret[_-]?key[\"'`_\\s]*[:=][\"'`_\\s]*[a-z0-9/+=]{40}'''
keywords = ["aws_secret_key", "aws-secret-key", "awssecretkey"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN[A-Z0-9\s]+PRIVATE KEY-----'''
keywords = ["BEGIN PRIVATE KEY", "BEGIN RSA PRIVATE KEY", "BEGIN EC PRIVATE KEY"]

[[rules]]
id = "slack-webhook"
description = "Slack Webhook"
regex = '''https://hooks.slack.com/services/[A-Za-z0-9]{9}/[A-Za-z0-9]{9}/[A-Za-z0-9]{24}'''
keywords = ["hooks.slack.com/services"]

[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = '''(?i)(secret|password|passwd|pwd|token|key|bearer)[\"'`_\\s]*[:=][\"'`_\\s]*[a-z0-9_\\-]{10,}'''
entropy = 3.5
keywords = ["secret", "password", "passwd", "pwd", "token", "key", "bearer"]

[[rules]]
id = "hardcoded-password-literal"
description = "Hardcoded password literal (including Wi-Fi passphrases)"
regex = '''(?i)(password|passwd|pwd|pass|wifi|wi[_-]?fi|network|ssid)[\"'`_\\s]*[:=][\"'`_\\s]*[a-z0-9_\\-!@#$%^&*()_+=\\[\\]{}|;:'",.<>/?`~]{8,}'''
entropy = 2.0
keywords = ["password", "passwd", "pwd", "pass", "wifi", "wi-fi", "network", "ssid"]
allowlist = [
    "test.*",
    ".*\\.test\\..*",
    ".*\\.spec\\..*"
]