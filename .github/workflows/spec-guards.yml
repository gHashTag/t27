# Three checks that existed and that nothing ran.
#
# Each was written after a defect it would have caught, and each has since
# caught a live one -- but only because someone remembered to type it. That is
# not a guard, it is a habit, and the next session does not inherit habits.
#
#   check_seal_currency.py    116 seals described output the compiler had
#                             stopped producing, left by five merged backend
#                             repairs. spec_hash was stale for ZERO of them, so
#                             every existing coverage and staleness check was
#                             green (#3415).
#   check_ring_spec_drift.py  ten of seventeen rings/* crates name a spec that
#                             exists; one had drifted and one was two designs
#                             sharing a vocabulary (#3422).
#   ring_spec_differential.py a matching signature is not matching behaviour:
#                             ring-090 read 16 of 16 identical and disagreed on
#                             126 of 1190 cases (#3420, #3424).
#   diagnostic_capacity.py    clang's default -ferror-limit=20 had been
#                             censoring every C error total published for this
#                             repository: 15133 errors, reported as 3849. A
#                             ratchet on the MEASURING APPARATUS -- it fails if
#                             an instrument that reported completely starts
#                             truncating (#3450).
#   check_duplicate_declarations.py
#                             three specs declare 25 top-level names twice and
#                             `t27c check` exited 0 on all of them. Every
#                             backend rejects a redeclaration -- measured, not
#                             assumed: cc `redefinition`, rustc E0428, zig
#                             `duplicate`, iverilog `already been declared`
#                             (#3438).
#
# NOT a required context, and it must not become one without the owner: a
# `paths:`-filtered workflow that is required hangs every pull request it does
# not match, forever, on a check that never posts. The `push:` trigger is here
# so master HAS a baseline -- a paths-filtered workflow with no push trigger
# runs zero times on the default branch and its history is empty (#2925 family).
#
# Cost, measured rather than estimated: 12s for the seal scan, 0s for the drift
# scan, ~1s per differential pair, 7s for the duplicate-declaration ratchet,
# under 1s for the diagnostic-capacity ratchet, on top of the compiler build.
name: Spec Guards

on:
  pull_request:
    paths:
      - 'bootstrap/src/**'
      - 'specs/**'
      - 'rings/**'
      - '.trinity/seals/**'
      - 'tools/check_seal_currency.py'
      - 'tools/check_seal_coverage.py'
      - 'tools/seal_baseline.txt'
      - 'tools/check_ring_spec_drift.py'
      - 'tools/ring_spec_differential.py'
      - 'tools/check_duplicate_declarations.py'
      - 'tools/duplicate_declarations_baseline.txt'
      - 'tools/lowered_collisions_baseline.txt'
      - 'tools/published_figures.py'
      - 'tools/diagnostic_capacity.py'
      - '.github/workflows/spec-guards.yml'
  push:
    branches: [master]
    paths:
      - 'bootstrap/src/**'
      - 'specs/**'
      - 'rings/**'
      - '.trinity/seals/**'
      - 'tools/check_seal_currency.py'
      - 'tools/check_seal_coverage.py'
      - 'tools/seal_baseline.txt'
      - 'tools/check_ring_spec_drift.py'
      - 'tools/ring_spec_differential.py'
      - 'tools/check_duplicate_declarations.py'
      - 'tools/duplicate_declarations_baseline.txt'
      - 'tools/lowered_collisions_baseline.txt'
      - 'tools/published_figures.py'
      - 'tools/diagnostic_capacity.py'
      - '.github/workflows/spec-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # RESTORE-ONLY, from the cache spec-parse-ratchet.yml saves on master.
      #
      # Measured on one PR head, codex/rust-value-params, 2026-10-04: the build
      # below took 243 s of this job's 258 s cold (run 37182032525) and compiled
      # 287 crates. spec-parse-ratchet ran the same `cargo build --release -p
      # t27c` on the same head in 40 s after a 5 s restore (run 37182032489),
      # and compiled exactly one crate: t27c.
      #
      # Why that workflow's key and not one of our own. A cache saved on a
      # pull_request ref is visible to that PR alone; a PR restores from
      # master. spec-parse-ratchet runs on EVERY push to master with no paths
      # filter, so its key is always there. A `cargo-spec-guards-` key would
      # reach master only after a paths-matching push, and every PR before
      # that would build cold. It is also the same compiler: neither workflow
      # installs a toolchain, so both build with the runner image's rustc, and
      # cargo hashes the rustc version into every artifact -- a cache from a
      # different rustc is reused for nothing (emit-bitexact-gate.yml is the
      # case where the two differ, and pairs with a different cache for it).
      #
      # Why restore-only. The repository's caches stood at 10.24 GB against
      # GitHub's 10 GB limit on 2026-10-04, 6.01 GB of it on PR refs. A save
      # here would add ~350 MB per PR and evict the least recently used entry,
      # which can be the very master cache every PR restores from.
      #
      # Not a stale-compiler risk: the build step still runs. The checkout
      # writes every source file with a fresh mtime, newer than the restored
      # fingerprints, so cargo recompiles t27c and reuses only the
      # dependencies -- the "1 crate" above is that, measured.
      - name: Restore cargo (spec-parse-ratchet's master cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-parse-ratchet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-parse-ratchet-

      - name: Build the compiler every check is measured against
        run: cargo build --release -p t27c

      # The self-checks run FIRST and separately. A checker whose own negative
      # control fails cannot be believed when it then reports zero, and running
      # them in the same step as the real scan would let a green scan hide a
      # broken instrument.
      - name: Self-check -- seal currency
        run: python3 tools/check_seal_currency.py --self-check

      - name: Self-check -- ring/spec drift
        run: python3 tools/check_ring_spec_drift.py --self-check

      - name: Self-check -- differential harness
        run: python3 tools/ring_spec_differential.py --self-check

      - name: Self-check -- duplicate declarations
        run: python3 tools/check_duplicate_declarations.py --self-check

      # The fixtures, before the counts. Two of the first five produced the
      # wrong KIND of diagnostic and both read as findings about the compiler.
      - name: Self-check -- diagnostic capacity fixtures
        run: python3 tools/diagnostic_capacity.py --self-check

      - name: Does every seal still describe what the compiler emits
        run: python3 tools/check_seal_currency.py

      - name: Does every ring still agree with the spec it names
        run: python3 tools/check_ring_spec_drift.py

      # A RATCHET against a per-spec baseline, not a total. A ceiling on the
      # sum is satisfied by zero and says nothing about a spec that grew while
      # another shrank.
      - name: Does any spec declare one name twice
        run: python3 tools/check_duplicate_declarations.py

      - name: Published figures -- self-check
        run: python3 tools/published_figures.py --self-check

      - name: Published figures -- every pinned spec population re-derived
        # A figure without its matcher is not reproducible and a figure whose
        # unit is implicit is not comparable. This re-derives each from the
        # specs, in CODE ONLY, and fails when one drifts -- the same contract
        # the census pin has: a change that moves a number must say so.
        run: python3 tools/published_figures.py --check

      # A ratchet on the instruments, not on the code: if a compiler that
      # reported completely starts truncating, every total measured with it
      # silently becomes a floor.
      - name: Does every compiler still report what it finds
        run: python3 tools/diagnostic_capacity.py

      - name: Run each CONVERGED pair on the same inputs
        shell: bash
        run: |
          set -euo pipefail
          # The pair list comes from the drift tool, not from this file: a
          # hard-coded list goes stale the first time a pair converges.
          #
          # `while read`, not `mapfile`: mapfile is bash 4+ and macOS ships bash
          # 3.2, so this step could not be run locally before pushing it. A
          # construct that only the runner can execute is a construct nobody
          # tested. The `|| [ -n "$line" ]` is not decoration -- a plain
          # `while read` DROPS a final line with no trailing newline.
          python3 tools/check_ring_spec_drift.py --converged > /tmp/converged.txt
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            n=$((n + 1))
            # shellcheck disable=SC2086
            python3 tools/ring_spec_differential.py $line
          done < /tmp/converged.txt
          if [ "$n" -eq 0 ]; then
            echo "::error::no CONVERGED pair -- the differential step measured nothing"
            exit 1
          fi
          echo "CONVERGED pairs run: $n"
