name: Untrusted Input Gate

# Two checks, deliberately separate:
#
#   check_untrusted_shell_interp.py  -- no workflow interpolates untrusted event
#                                       data into a run: block
#   test_untrusted_payloads.py       -- the two shell forms behave as claimed, on
#                                       payloads whose effect is declared up front
#   check_untrusted_javascript_interp.py -- no github.* expression enters a
#                                         github-script source block
#   test_untrusted_javascript_payloads.py -- JavaScript source injection fails
#                                           while process.env preserves data
#
# The first is a property of this repository and can be fixed. The second is a
# property of bash and cannot; it exists so that the first check's reason is
# reproducible rather than asserted.
#
# No `branches:` filter: a gate that filters pull_request by branch does not run
# on a stacked PR and reads as green (see #2167).

on:
  pull_request:
  push:
    branches: [master]
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  untrusted-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: The Admitted gate reads every file _CoqProject names, or says it could not
        # #3063. grep answers 0 matched / 1 no match / 2 cannot open, and an
        # `if` merges the last two. Runs here rather than in coq-kernel.yml so
        # it needs no Coq toolchain: the test builds its own two-file tree.
        run: python3 scripts/ci/test_admitted_gate_reads_every_named_file.py

      - name: An empty rings matrix refuses instead of skipping the build
        # #3069. The build job is guarded by `count != '0'`, a skipped job is
        # green, and a crate rename matches rings-rust.yml's own paths filter --
        # so the commit that empties the matcher runs the workflow and collects
        # a green tick. Runs here: needs no Rust, and the test builds its own
        # ring tree and executes the workflow step under GitHub's shell flags.
        run: python3 scripts/ci/test_rings_matrix_refuses_an_empty_population.py

      - name: No hook invents an issue number from a branch name
        # #3071. `(issue-|#)?[0-9]+` with the prefix OPTIONAL gave 1048 of this
        # repository's 1294 branches an issue number they do not carry, while
        # ZERO branches use the documented `issue-N` form. Runs here: pure bash
        # and git, no compiler.
        run: python3 scripts/ci/test_hooks_do_not_invent_an_issue_number.py

      - name: The published catalog table still matches the tree
        # #3079. P17 published a seven-row table of what catalog-gate checks; the
        # catalog has since gone 83 -> 109 records, one listed check was renamed
        # away, and three unlisted ones run. Pure grep, no compiler: the
        # mandatory-field population is exactly `grep -c 'CATALOG:'`.
        run: python3 scripts/ci/test_catalog_table_matches_the_gate.py

      - name: The two required gates name their own subject, not the wrong one
        # #3061. Both are in docs/BRANCH-PROTECTION.md's required list, so a
        # wrong message lands on a check nobody can merge past: the NOW gate
        # said "adds no docs/now/ entry" about a comparison git refused to make,
        # and the Issue Gate said "No issue reference found in PR title/body"
        # about a pull request that does not exist. Runs here rather than in
        # either gate's own workflow so a break in the test cannot turn a
        # required context red for a reason unrelated to the change under test.
        run: python3 scripts/ci/test_required_gates_name_their_subject.py

      - name: Every path a status table marks COMPLETE is on disk
        # #3082. META_DASHBOARD marked four CLARA deliverables COMPLETE against
        # paths removed on 2026-04-19 by a 1214-file recovery commit. Pure
        # os.path, no build. The matcher is deliberately narrow -- 12 rows, not
        # the 232 a loose one gives -- and refuses to report if it fails its own
        # planted-row control.
        run: python3 scripts/ci/test_status_tables_name_paths_that_exist.py

      - name: Every re-taken proposition is still anchored
        # #3086. Three figures in the living document had drifted -- 1,135 ->
        # 1,953, 101/397 -> 290/650, 608 specs -> 650 -- and each re-take is
        # written beside the original with a commit. This guards the re-takes:
        # a number labelled "Now" with no anchor is the defect they record.
        run: python3 scripts/ci/test_retaken_propositions_still_match.py

      - name: No untrusted event data interpolated into shell
        run: python3 scripts/ci/check_untrusted_shell_interp.py

      - name: Payload behaviour matches what is claimed about it
        run: python3 scripts/ci/test_untrusted_payloads.py

      - name: No event data interpolated into github-script source
        run: python3 scripts/ci/check_untrusted_javascript_interp.py

      - name: JavaScript payload behaviour matches what is claimed about it
        run: python3 scripts/ci/test_untrusted_javascript_payloads.py
