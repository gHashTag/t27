# GENERATED from specs/ci/gates/ci-cards.t27 by tools/ci/gen_workflows.py.
# Do not edit this file: edit the card, then run
#   python3 tools/ci/gen_workflows.py
# The card carries the reasons. `--check` (.github/workflows/ci-cards.yml) fails
# on any byte here that differs from what the card generates.
name: CI Cards

on:
  pull_request:
    paths:
      - specs/ci/**
      - .github/workflows/**
      - tools/ci/gen_workflows.py
      - bootstrap/src/**
  push:
    branches: [master]
    paths:
      - specs/ci/**
      - .github/workflows/**
      - tools/ci/gen_workflows.py
      - bootstrap/src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cards:
    name: Workflows match their .t27 cards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml

      - name: Restore the cargo cache spec-parse-ratchet.yml saves
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-parse-ratchet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-parse-ratchet-

      - name: Build t27c
        run: cargo build --release -p t27c

      - name: Install zig -- its directory
        run: mkdir -p $RUNNER_TEMP/zig

      - name: Install zig -- download 0.16.0
        run: curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o $RUNNER_TEMP/zig.tar.xz

      - name: Install zig -- unpack
        run: tar -xJf $RUNNER_TEMP/zig.tar.xz -C $RUNNER_TEMP/zig --strip-components=1

      - name: Install zig -- onto PATH
        run: echo $RUNNER_TEMP/zig >> $GITHUB_PATH

      - name: The generator refuses what it exists to refuse (self-check)
        run: python3 tools/ci/gen_workflows.py --self-check --t27c target/release/t27c

      - name: Every workflow matches its card
        run: python3 tools/ci/gen_workflows.py --check --t27c target/release/t27c
