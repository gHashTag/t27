name: Coq Proofs Validation

on:
  push:
    paths:
      - 'proofs/trinity/**.v'
      - '.github/workflows/coq-proofs.yml'
  pull_request:
    paths:
      - 'proofs/trinity/**.v'
      # This file. Without it a PR that repairs this workflow cannot run it, so
      # the repair ships unverified -- which is how it stayed broken. The `push:`
      # block above already lists it; the two triggers disagreed.
      - '.github/workflows/coq-proofs.yml'
  workflow_dispatch:

jobs:
  compile-proofs:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.19-ocaml-4.14-flambda
      options: --user root
    # `--user root` is why every run of this job has failed. The image
    # initialises opam for the `coq` user under /home/coq/.opam; as root, OPAMROOT
    # defaults to /root/.opam, which does not exist. The log says so exactly:
    #
    #     [WARNING] Running as root is not recommended
    #     [ERROR] Opam has not been initialised, please run `opam init'
    #     ##[error]Process completed with exit code 50.
    #
    # Pointing OPAMROOT at the root the image actually built is the whole fix.
    # `--user root` stays: checkout writes into a workspace root owns.
    env:
      OPAMROOT: /home/coq/.opam
      OPAMYES: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Coq Interval
        run: |
          opam update
          # NOT `coq-interval.4.9.0`. That pin is incompatible with the image
          # this job runs in, and said so as soon as OPAMROOT was fixed and opam
          # could get far enough to compute a solution:
          #
          #     [ERROR] Package conflict!
          #       * Missing dependency:
          #         - coq-interval = 4.9.0 -> coq < 8.19~
          #     No solution found, exiting
          #
          # The image is coqorg/coq:8.19. 7 of the 13 proof files `Require Import
          # Interval.Tactic`, so the dependency is real and cannot be dropped --
          # only the version can move. Unpinned here deliberately, because the
          # version that resolves against Coq 8.19 has never been observed in
          # this job: it has never run this far. The next line records what the
          # solver chose, and that reading is what a pin should be restored from.
          opam install -y coq-interval
          opam list --installed coq-interval
          # Prove the switch is really there before anything depends on it.
          eval $(opam env)
          coqc --version

      - name: Compile Proofs
        run: |
          # A new step is a new shell, so the switch has to be re-entered; without
          # this, coqc is either absent or the wrong one.
          eval $(opam env)
          cd proofs/trinity
          echo "Compiling Coq proof files..."
          # ATTEMPT EVERY FILE, then report. The previous form was
          # `coqc ... || exit 1` thirteen times, which stops at the first
          # failure -- so one CI run yields exactly one error, and finding
          # out how many of the 13 files compile costs one run per file.
          #
          # That became the binding constraint the moment this job started
          # working. It had never got past `opam install`, so coqc had never
          # run on these proofs at all; the first thing it said was that file
          # 1 of 13 does not compile, and the state of the other 12 was
          # unknown. A stop-at-first-error loop cannot answer that, and at
          # ~4 minutes a run it cannot answer it cheaply either.
          #
          # A failure here may be CAUSED by an earlier one -- these compile in
          # dependency order and a missing .vo cascades -- so the report marks
          # which failures follow a failed dependency instead of presenting
          # all of them as independent defects.
          set +e
          ORDER="CorePhi AlphaPhi FormulaEval Bounds_Masses Bounds_Mixing
                 Bounds_Gauge Bounds_LeptonMasses Bounds_QuarkMasses
                 Unitarity ConsistencyChecks ExactIdentities DerivationLevels
                 Catalog42"
          PASS=0; FAIL=0; FAILED_ANY=0
          : > /tmp/coq-report.txt
          for m in $ORDER; do
            OUT=$(coqc -R . Trinity "$m.v" 2>&1)
            RC=$?
            if [ $RC -eq 0 ]; then
              PASS=$((PASS+1))
              printf '  ok        %s\n' "$m.v" >> /tmp/coq-report.txt
            else
              FAIL=$((FAIL+1))
              if [ $FAILED_ANY -eq 1 ]; then TAG='FAIL*   '; else TAG='FAIL    '; fi
              FAILED_ANY=1
              FIRST=$(printf '%s\n' "$OUT" | grep -m1 -E '^(Error|File)' || printf '%s' "$OUT" | head -1)
              printf '  %s  %-26s %s\n' "$TAG" "$m.v" "$FIRST" >> /tmp/coq-report.txt
              printf '::group::%s\n%s\n::endgroup::\n' "$m.v" "$OUT"
            fi
          done
          set -e
          echo
          echo "=== Coq compile report: $PASS of 13 compiled ==="
          cat /tmp/coq-report.txt
          if [ "$FAIL" -gt 0 ]; then
            echo
            echo "  FAIL* = failed AFTER an earlier failure; may be a cascade, not"
            echo "  an independent defect. Only the first FAIL is certainly its own."
            echo "::error::$FAIL of 13 Coq files did not compile"
            exit 1
          fi
          echo "All files compiled successfully!"

      - name: Verify No Admitted Proofs
        run: |
          cd proofs/trinity
          echo "Checking for admitted proofs..."
          ADMISSIONS=$(grep -r "^Admitted" *.v 2>/dev/null | wc -l)
          echo "Found $ADMISSIONS admitted proofs"
          if [ "$ADMISSIONS" -gt 0 ]; then
            echo "WARNING: Found admitted proofs. These need completion."
            echo "Admitted proofs:"
            grep -n "^Admitted" *.v 2>/dev/null
            # Don't fail the build for now - just warn
            # exit 1
          else
            echo "SUCCESS: All proofs are complete (no Admitted)"
          fi

      - name: Count Theorems
        run: |
          cd proofs/trinity
          echo "=== Theorem Statistics ==="
          THEOREMS=$(grep "^Theorem " *.v 2>/dev/null | wc -l)
          LEMMAS=$(grep "^Lemma " *.v 2>/dev/null | wc -l)
          QED=$(grep "^Qed" *.v 2>/dev/null | wc -l)
          ADMISSIONS=$(grep "^Admitted" *.v 2>/dev/null | wc -l)

          echo "Theorems: $THEOREMS"
          echo "Lemmas: $LEMMAS"
          echo "Qed (complete): $QED"
          echo "Admitted (incomplete): $ADMISSIONS"

          if [ "$THEOREMS" -gt 0 ]; then
            COMPLETION=$(( ($QED - $LEMMAS) * 100 / $THEOREMS ))
            echo "Theorem completion rate: ${COMPLETION}%"
          fi

      - name: Generate Status Report
        if: always()
        run: |
          cd proofs/trinity
          cat > coq-status.md << 'EOF'
          # Coq Proof Status Report
          Generated: $(date)

          ## Compilation Status
          $(grep "^Admitted" *.v 2>/dev/null | wc -l) admitted proofs remaining

          ## Detailed Status
          | File | Theorems | Qed | Admitted |
          |------|----------|-----|----------|
          EOF

          for file in *.v; do
            if [ -f "$file" ]; then
              THMS=$(grep "^Theorem " "$file" 2>/dev/null | wc -l)
              QEDS=$(grep -A 1000 "^Theorem " "$file" 2>/dev/null | grep "^Qed" | wc -l)
              ADMTS=$(grep "^Admitted" "$file" 2>/dev/null | wc -l)
              echo "| $file | $THMS | $QEDS | $ADMTS |" >> coq-status.md
            fi
          done

          cat coq-status.md

      - name: Upload Status Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coq-status-report
          path: proofs/trinity/coq-status.md
