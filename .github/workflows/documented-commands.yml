# Every `t27c <sub>` a live document tells you to run must be a real subcommand.
#
# `t27c gen-zig` is named in docs/TRI_NET_WHITEPAPER.md and in a nona-01 mapping
# table. There is no such subcommand -- the Zig generator is `t27c gen` -- and
# clap exits 2 for an unknown subcommand, which is also this repo's "could not
# run" code. Generating the corpus with it produced 650 usage errors that read
# as a measurement of 650 specs failing to generate.
#
# The ruler is the binary's own --help, so this job builds BOTH. A list of
# subcommands kept in the checker would be a second source of truth, and the
# first thing a drifting ruler reports is the ruler.
#
# `tri` needs all four surfaces it resolves through -- bash case arms in
# scripts/tri, scripts/tri_loop/*.py, the Rust binary, and t27c via the
# forward-anything fallthrough. Missing the last one alone would report 155
# false deaths, so the checker refuses rather than guessing when either binary
# is absent.
#
# No `paths:` filter, for the reason spelled out in verilog-widths.yml: a
# filtered workflow is skipped on the PR whose merge diff cannot be computed,
# and a filter with no matching `push:` means zero runs on master, where "never
# failed" and "never ran" read identically.
name: Documented Commands

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documented-commands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documented-commands:
    runs-on: ubuntu-latest
    name: Documented t27c subcommands exist
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doccmds-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-doccmds-

      - name: Build both rulers (each is its own --help)
        run: cargo build --release -p t27c -p tri

      - name: Check that this checker can fail
        run: python3 tools/check_documented_commands_exist.py --self-check

      - name: Read the live documents
        run: python3 tools/check_documented_commands_exist.py
