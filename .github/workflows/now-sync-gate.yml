name: NOW Sync Gate
on:
  # No `branches:` filter on pull_request, deliberately. This gate is in the
  # required-check set, and with the filter it did not run at all on a PR whose
  # base was another branch -- `gh pr checks` then showed a green list on a
  # stacked PR that no substantive gate had examined. A check that is absent is
  # not a check that passed, and a reviewer reading the green list cannot tell
  # the two apart. Measured on this repository: three gates (this one,
  # issue-gate, seal-staleness-warn) were all silently skipped on stacked PRs.
  #
  # push keeps its filter: pushes to topic branches do not need the gate, only
  # the protected branch does.
  pull_request:
  push:
    branches: [master]
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

jobs:
  check-now-freshness:
    runs-on: ubuntu-latest
    # Closes #1031: trusted bots (Dependabot) PASS this required gate as a no-op
    # instead of SKIPPING it (a skipped required check never satisfies branch
    # protection). Detect bot via trigger actor AND PR author login (survives a
    # human 'Update branch'); short-circuit the substantive steps. push events
    # keep their existing behavior because pull_request is null there.
    env:
      IS_BOT: ${{ (github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'github-actions[bot]') && 'true' || 'false' }}
    steps:
      - name: Trusted-bot bypass (no-op pass)
        if: env.IS_BOT == 'true'
        run: |
          echo "Trusted bot PR -- gate passes as no-op. Closes 1031."

      - uses: actions/checkout@v6
        if: env.IS_BOT != 'true'
        with:
          fetch-depth: 0

      # Presence AND freshness are both asserted inside the script now. They used
      # to be two steps: a diff check here and a `grep -m1 "Last updated:"` parse
      # of docs/NOW.md below. With one entry file per PR the date lives in the
      # filename, so a single pass over the added paths establishes both -- and
      # there is no longer a shared line for two branches to edit.
      - name: Require a fresh docs/now/ entry (pull_request)
        if: env.IS_BOT != 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: pull_request
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/now-sync-gate-diff.sh

      - name: Require a fresh docs/now/ entry (push)
        if: env.IS_BOT != 'true' && github.event_name == 'push'
        env:
          GITHUB_EVENT_NAME: push
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: bash scripts/ci/now-sync-gate-diff.sh

      - name: Check agent sync JSON exists
        if: env.IS_BOT != 'true'
        run: |
          if [ ! -f ".trinity/state/github-sync.json" ]; then
            echo "::warning::Agent sync file missing: .trinity/state/github-sync.json"
          else
            echo "✅ Agent sync file present"
          fi
