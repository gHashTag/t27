name: FPGA E2E Build

on:
  pull_request:
    # No `branches:` filter on pull_request, deliberately. A branch filter makes
    # this gate silent on any PR whose base is not listed -- a stacked PR then
    # shows a green check list that a master-based PR would not get. Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below, where one
    # exists, is left alone: restricting post-merge runs is a cost decision.
    paths:
      - 'specs/fpga/**'
      - 'bootstrap/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'contrib/formal/**'
      - 'conformance/fpga_*.json'
      # The gates this job runs, and the ledgers they compare against. Without
      # these four, a one-line edit to check_vector_data.py (`return 1` ->
      # `return 0`) lands in a PR that never runs the gate -- a silent kill --
      # and a new prose-only vector file can be admitted by splitting the
      # pre-seed and the file across two PRs. Every sibling workflow in this
      # repository lists its own tool; this one did not.
      - 'tools/check_vector_data.py'
      - 'tools/vector_data_baseline.txt'
      - 'tools/check_elab_ratchet.py'
      - 'tools/elab_baseline.txt'
      - 'tools/run_conformance_vvp.py'
      - '.github/workflows/fpga-build.yml'
  push:
    branches: [master]
    paths:
      - 'specs/fpga/**'
      - 'bootstrap/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'contrib/formal/**'
      - 'conformance/fpga_*.json'
      # The gates this job runs, and the ledgers they compare against. Without
      # these four, a one-line edit to check_vector_data.py (`return 1` ->
      # `return 0`) lands in a PR that never runs the gate -- a silent kill --
      # and a new prose-only vector file can be admitted by splitting the
      # pre-seed and the file across two PRs. Every sibling workflow in this
      # repository lists its own tool; this one did not.
      - 'tools/check_vector_data.py'
      - 'tools/vector_data_baseline.txt'
      - 'tools/check_elab_ratchet.py'
      - 'tools/elab_baseline.txt'
      - 'tools/run_conformance_vvp.py'
      - '.github/workflows/fpga-build.yml'
  workflow_dispatch:

jobs:
  fpga-smoke:
    # A hung apt step ran 6h0m16s to the GitHub ceiling on 2026-08-18 and
    # read as a red PR whose own steps were all skipped (#2214).
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fpga-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fpga-

      - name: Install Yosys
        run: |
          # apt on a dead mirror HANGS (no error): five jobs burned whole 45-90m
          # ceilings on Install steps 2026-08-19. Bound each attempt, retry, fail fast.
          for i in 1 2 3; do
            timeout 420 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
              && timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 yosys \
              && break
            echo "::warning::apt attempt $i failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done

      - name: Build t27c
        run: cargo build --release -p t27c

      - name: FPGA smoke test (Verilog generation only)
        run: ./target/release/t27c fpga-build --smoke

      - name: Verilog regression check
        run: |
          echo "## Verilog hash regression" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size (bytes) | SHA256 (first 16) |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|-------------------|" >> $GITHUB_STEP_SUMMARY
          for v in build/fpga/generated/*.v; do
            name=$(basename "$v")
            size=$(wc -c < "$v" | tr -d ' ')
            hash=$(shasum -a 256 "$v" | cut -c1-16)
            echo "| $name | $size | $hash |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          total_size=$(du -sb build/fpga/generated/ | cut -f1)
          total_files=$(ls build/fpga/generated/*.v | wc -l)
          echo "**Total:** $total_files files, $total_size bytes" >> $GITHUB_STEP_SUMMARY

      - name: Upload generated Verilog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-verilog
          path: build/fpga/generated/
          retention-days: 7

  # The job ID stays `fpga-lint`: `fpga-report` depends on it by that name, and
  # renaming a job ID silently breaks any branch-protection context matching it.
  # The DISPLAY name carries the depth, because the check list is the only thing
  # most readers see, and "fpga-lint (passed)" is read as "the RTL is well-formed".
  # It is not what this job measures -- see the header on the lint step below and
  # issue #2326.
  fpga-lint:
    name: fpga-lint (read_verilog + hierarchy)
    # A hung apt step ran 6h0m16s to the GitHub ceiling on 2026-08-18 and
    # read as a red PR whose own steps were all skipped (#2214).
    timeout-minutes: 45
    needs: fpga-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fpga-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fpga-

      - name: Install Yosys
        run: |
          # apt on a dead mirror HANGS (no error): five jobs burned whole 45-90m
          # ceilings on Install steps 2026-08-19. Bound each attempt, retry, fail fast.
          for i in 1 2 3; do
            timeout 420 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
              && timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 yosys \
              && break
            echo "::warning::apt attempt $i failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done

      - name: Build t27c
        run: cargo build --release -p t27c

      - name: Synth readiness check (all modules)
        run: ./target/release/t27c synth-readiness

      - name: Download generated Verilog
        uses: actions/download-artifact@v4
        with:
          name: fpga-verilog
          path: build/fpga/generated/

      # What this step measures, and what it does not (#2326).
      #
      # Yosys elaborates a function body only where the function is CALLED. In the
      # generated Verilog almost nothing calls its own functions: measured over the
      # 32 files of the `fpga-verilog` artifact of run 32464326319, 485 functions
      # are defined and 79 have a call site -- 406 have none. `hierarchy -top` walks
      # the module header and the one or two logic blocks and never enters the rest.
      #
      # So this loop reported 32/32 on the same artifact that `iverilog -g2012
      # -DSIMULATION` compiles 4/32 -- both measured by hand on the artifact, and
      # both visible in run 32464326319 itself, where fpga-lint concluded success
      # and fpga-conformance concluded failure against one upload.
      #
      # Deepening yosys does not close the gap; the axis is reachability, not depth.
      # `synth -top` over the same 32 is 31 pass / 1 fail, and the one failure is
      # `zerodsp_top` for a missing submodule (one-file-at-a-time compilation), not
      # a codegen defect -- it would flag 1 of the 28 for the wrong reason and still
      # certify the other 27. Injecting a single call site into fifo.v is what makes
      # the defect reachable: `assign __probe_aw = addr_width(32'd0);` turns this
      # exact command from silent rc=0 into
      #     fifo_probe.v:174: ERROR: Non-constant expression in constant function
      # on the same line 174 (`d = cfg_depth;`) that Icarus reports.
      #
      # This step is therefore left AS IS in what it runs. Only what it CLAIMS is
      # corrected. Making it catch the 28 is a gate-policy decision (it turns the
      # job red until #2325 lands), not a wording fix.
      - name: Yosys parse + hierarchy (all modules)
        run: |
          echo "## Yosys parse + hierarchy (all modules)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo 'Depth: `read_verilog -sv -DSIMULATION` then `hierarchy -top <module>`.' >> $GITHUB_STEP_SUMMARY
          echo 'That is parse plus top-level hierarchy resolution, and nothing deeper.' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo 'DOES NOT CHECK: function bodies are not elaborated. Yosys enters a' >> $GITHUB_STEP_SUMMARY
          echo 'function only at a call site, and 406 of the 485 functions in these' >> $GITHUB_STEP_SUMMARY
          echo 'files have none, so a green result here means the files parse and their' >> $GITHUB_STEP_SUMMARY
          echo 'top-level hierarchy resolves. It does not mean the RTL is well-formed:' >> $GITHUB_STEP_SUMMARY
          echo 'this loop passes 32/32 on an artifact `iverilog -g2012 -DSIMULATION`' >> $GITHUB_STEP_SUMMARY
          echo 'compiles 4/32. Full elaboration is the Icarus step in fpga-conformance.' >> $GITHUB_STEP_SUMMARY
          echo 'See #2326 (this gap), #2325 (the emitter defect behind the 28), and' >> $GITHUB_STEP_SUMMARY
          echo '#2241 (conformance vectors are compiled but never executed).' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | read_verilog | hierarchy | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          pass=0
          fail=0
          for v in build/fpga/generated/*.v; do
            # The top is the MODULE name, not the file name -- mac.v holds ZeroDSP_MAC,
            # so a filename-derived top failed 31 of 32 modules. The repo's own
            # convention (suite.rs:859, verify_emit_bitexact.py:184) reads generated
            # Verilog with `-sv -DSIMULATION`: -sv for the emitter's SV static casts,
            # -DSIMULATION to strip `ifndef SIMULATION` bench blocks whose $display
            # has non-constant args synthesis cannot evaluate (mac.v:535). As
            # written, this loop could never have passed.
            name=$(sed -n 's/^module \([A-Za-z0-9_]*\).*/\1/p' "$v" | head -1)
            if yosys -p "read_verilog -sv -DSIMULATION $v; hierarchy -top $name" -q 2>/dev/null; then
              echo "| $name | OK | OK | PASS |" >> $GITHUB_STEP_SUMMARY
              pass=$((pass+1))
            else
              echo "| $name | FAIL | - | FAIL |" >> $GITHUB_STEP_SUMMARY
              fail=$((fail+1))
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          total=$((pass+fail))
          echo "**Result:** $pass/$total modules parsed and resolved top-level hierarchy (read_verilog + hierarchy)." >> $GITHUB_STEP_SUMMARY
          echo "Function bodies were not elaborated, so this is not a clean bill of health for the RTL." >> $GITHUB_STEP_SUMMARY
          if [ "$fail" -gt 0 ]; then
            # Audit 2026-08-19: a warning-only gate absorbed a live codegen
            # regression (fifo.v invalid Verilog) within 40 minutes of the
            # 32/32 claim. Lint failures now fail the step.
            echo "::error::$fail/$total modules failed read_verilog or hierarchy. Defects inside uncalled function bodies are out of this job's reach -- see fpga-conformance and #2326."
            exit 1
          fi

  fpga-synthesis:
    # A hung apt step ran 6h0m16s to the GitHub ceiling on 2026-08-18 and
    # read as a red PR whose own steps were all skipped (#2214).
    timeout-minutes: 45
    needs: fpga-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fpga-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fpga-

      - name: Install Yosys
        run: |
          # apt on a dead mirror HANGS (no error): five jobs burned whole 45-90m
          # ceilings on Install steps 2026-08-19. Bound each attempt, retry, fail fast.
          for i in 1 2 3; do
            timeout 420 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
              && timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 yosys \
              && break
            echo "::warning::apt attempt $i failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done

      - name: Build t27c
        run: cargo build --release -p t27c

      - name: FPGA synthesis (Yosys + JSON netlist)
        run: ./target/release/t27c fpga-build --docker false --synth-only

      - name: Synthesis regression check
        run: |
          if [ ! -f build/fpga/synth/synth.json ]; then
            echo "::error::synth.json not produced"
            exit 1
          fi
          size=$(wc -c < build/fpga/synth/synth.json | tr -d ' ')
          echo "## Synthesis regression" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| synth.json size | $size bytes |" >> $GITHUB_STEP_SUMMARY
          hash=$(shasum -a 256 build/fpga/synth/synth.json | cut -c1-16)
          echo "| synth.json SHA256 | $hash... |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$size" -lt 1000 ]; then
            echo "::warning::synth.json suspiciously small ($size < 1000 bytes)"
          fi

      - name: Utilization regression check
        run: |
          echo "## Utilization Regression" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          XC7A100T_MAX_LUTS=63400
          XC7A100T_MAX_FFS=126800
          XC7A100T_MAX_BRAM18=135
          XC7A100T_MAX_DSP48=240
          if [ -f build/fpga/synth/synth.log ]; then
            luts=$(grep -oP '\d+(?=\s+cells)' build/fpga/synth/synth.log 2>/dev/null | head -1 || echo "0")
            echo "| Resource | Used | Max (XC7A100T) | Util %" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------|----------------|--------|" >> $GITHUB_STEP_SUMMARY
            if [ "$luts" -gt 0 ] 2>/dev/null; then
              pct=$((luts * 100 / XC7A100T_MAX_LUTS))
              echo "| LUTs | $luts | $XC7A100T_MAX_LUTS | ${pct}% |" >> $GITHUB_STEP_SUMMARY
              if [ "$pct" -gt 90 ]; then
                echo "::warning::LUT utilization ${pct}% exceeds 90% threshold"
              fi
            else
              echo "| LUTs | (parse from synth.log) | $XC7A100T_MAX_LUTS | - |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "| BRAM18 | (parse from synth.log) | $XC7A100T_MAX_BRAM18 | - |" >> $GITHUB_STEP_SUMMARY
            echo "| DSP48 | (parse from synth.log) | $XC7A100T_MAX_DSP48 | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No synth.log found for utilization check." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Generate utilization report
        run: |
          echo "## FPGA Utilization Report" > build/fpga/report.md
          echo "" >> build/fpga/report.md
          echo "| Metric | Value |" >> build/fpga/report.md
          echo "|--------|-------|" >> build/fpga/report.md
          if [ -f build/fpga/synth/synth.log ]; then
            luts=$(grep -oP '\d+(?=\s+cells)' build/fpga/synth/synth.log 2>/dev/null | head -1 || echo "N/A")
            echo "| LUT estimate | $luts |" >> build/fpga/report.md
          else
            echo "| LUT | (see synth.log) |" >> build/fpga/report.md
          fi
          synth_json_size=$(wc -c < build/fpga/synth/synth.json | tr -d ' ')
          echo "| synth.json | ${synth_json_size} bytes |" >> build/fpga/report.md
          echo "| Board | QMTECH XC7A100T |" >> build/fpga/report.md
          echo "| Profile | minimal |" >> build/fpga/report.md
          echo "| Toolchain | Yosys (open-source) |" >> build/fpga/report.md
          echo "" >> build/fpga/report.md
          echo "Full utilization data in synth.log artifact." >> build/fpga/report.md
          cat build/fpga/report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload synthesis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-synthesis
          path: |
            build/fpga/generated/
            build/fpga/synth/
            build/fpga/report.md
          retention-days: 7

  fpga-synthesis-arty:
    # A hung apt step ran 6h0m16s to the GitHub ceiling on 2026-08-18 and
    # read as a red PR whose own steps were all skipped (#2214).
    timeout-minutes: 45
    needs: fpga-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fpga-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fpga-

      - name: Install Yosys
        run: |
          # apt on a dead mirror HANGS (no error): five jobs burned whole 45-90m
          # ceilings on Install steps 2026-08-19. Bound each attempt, retry, fail fast.
          for i in 1 2 3; do
            timeout 420 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
              && timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 yosys \
              && break
            echo "::warning::apt attempt $i failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done

      - name: Build t27c
        run: cargo build --release -p t27c

      - name: FPGA synthesis (Arty A7-100T, minimal profile)
        run: ./target/release/t27c fpga-build --docker false --synth-only --minimal

      - name: Arty A7 synthesis check
        run: |
          echo "## Arty A7 Synthesis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/fpga/synth/synth.json ]; then
            size=$(wc -c < build/fpga/synth/synth.json | tr -d ' ')
            echo "| synth.json size | $size bytes |" >> $GITHUB_STEP_SUMMARY
            echo "| Board | Arty A7-100T |" >> $GITHUB_STEP_SUMMARY
            echo "| Profile | minimal |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | FAIL |" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Arty A7 synthesis did not produce synth.json"
          fi

  fpga-bitstream:
    # A hung apt step ran 6h0m16s to the GitHub ceiling on 2026-08-18 (#2214).
    # 90 rather than 45: the first uncached run builds openXC7 nextpnr-xilinx
    # AND exports a real chipdb; the cache makes later runs minutes.
    timeout-minutes: 90
    needs: fpga-synthesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache Cargo + FPGA tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.local/bin/nextpnr-xilinx
            ~/prjxray-build
          key: ${{ runner.os }}-fpga-tools-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fpga-tools-
      
      - name: Install system dependencies
        run: |
          # apt on a dead mirror HANGS (no error): five jobs burned whole 45-90m
          # ceilings on Install steps 2026-08-19. Bound each attempt, retry, fail fast.
          for i in 1 2 3; do
            timeout 420 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
              && timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 yosys git cmake g++ pkg-config libboost-all-dev libeigen3-dev python3-pip \
              && break
            echo "::warning::apt attempt $i failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done
        
      - name: Build t27c
        run: cargo build --release -p t27c
      
      - name: Build nextpnr-xilinx
        run: |
            # YosysHQ/nextpnr does NOT contain a `xilinx` architecture -- it lives in the
            # openXC7/nextpnr-xilinx fork. As written, this step could never have passed:
            # cmake fails with "Architecture 'xilinx' not in list". Same class as the
            # yosys loop above.
            if [ ! -f ~/.local/bin/nextpnr-xilinx ] || [ ! -f ~/.local/bin/bbasm ]; then
              cd ~
              git clone --recursive --depth 1 https://github.com/openXC7/nextpnr-xilinx.git
              cd nextpnr-xilinx
              cmake . -DARCH=xilinx -DUSE_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release
              make -j4 nextpnr-xilinx bbasm
              mkdir -p ~/.local/bin
              # In-tree cmake puts both binaries at the build root, not under bba/.
              cp nextpnr-xilinx bbasm ~/.local/bin/
            fi
      
      - name: Build prjxray tools
        run: |
          if [ ! -f ~/prjxray-build/xc7frames2bit ]; then
            cd ~
            # prjxray keeps yaml-cpp and friends as submodules -- a bare clone has no
              # CMakeLists for them and cmake dies on target yaml-cpp.
              git clone --recursive --depth 1 --shallow-submodules https://github.com/SymbiFlow/prjxray.git
            cd prjxray
            mkdir build && cd build
            cmake ..
            make xc7frames2bit
            # The binary lands in build/tools/, not build/ -- one more line that had
              # never executed before this PR.
              mkdir -p ~/prjxray-build
              cp tools/xc7frames2bit ~/prjxray-build/
          fi
      
      - name: Download prjxray database
        run: |
          # t27c resolves the db at build/nextpnr-xilinx/xilinx/external/prjxray-db/artix7
          # relative to the repo root. The old step cloned the WHOLE prjxray-db repo into
          # ~/prjxray-db/artix7 -- a path nothing reads, with the real artix7 db one
          # level deeper than the directory name claimed.
          mkdir -p build/nextpnr-xilinx/xilinx/external
          if [ ! -d build/nextpnr-xilinx/xilinx/external/prjxray-db/artix7 ]; then
            git clone --depth 1 https://github.com/SymbiFlow/prjxray-db build/nextpnr-xilinx/xilinx/external/prjxray-db
          fi

      - name: Stage prjxray where t27c expects it
        run: |
          # Layer 11 of the onion: t27c hardcodes build/fpga/prjxray (clone location AND
          # PYTHONPATH) and build/fpga/prjxray/build/tools/xc7frames2bit; everything this
          # job built so far lived under ~/, so fasm2frames.py could never be found.
          # fasm2frames needs no prjxray submodules; its import chain resolves with the
          # packages below (verified by running --help against this exact list).
          if [ ! -f build/fpga/prjxray/utils/fasm2frames.py ]; then
            git clone --depth 1 https://github.com/SymbiFlow/prjxray.git build/fpga/prjxray
          fi
          mkdir -p build/fpga/prjxray/build/tools
          cp ~/prjxray-build/xc7frames2bit build/fpga/prjxray/build/tools/
          pip3 install fasm simplejson pyyaml intervaltree parse progressbar2 \
            || pip3 install --break-system-packages fasm simplejson pyyaml intervaltree parse progressbar2

      - name: Generate real chipdb (xc7a100t)
        run: |
          # This step used to write 1 MB of /dev/zero and call it a chipdb. A
          # bitstream placed-and-routed against zeroes is not a bitstream, and the
          # artefact + flashing guide downstream were outputs shaped like results
          # with nothing inside. The database is now generated for real from the
          # openXC7 tree and cached; first generation costs minutes, cache makes it
          # free afterwards.
          mkdir -p build/fpga/chipdb ~/fpga/chipdb
          if [ ! -f ~/fpga/chipdb/xc7a100tcsg324-1.bin ]; then
            cd ~/nextpnr-xilinx 2>/dev/null || { cd ~ && git clone --recursive --depth 1 https://github.com/openXC7/nextpnr-xilinx.git && cd nextpnr-xilinx; }
            python3 xilinx/python/bbaexport.py --device xc7a100tcsg324-1 --bba /tmp/xc7a100t.bba
            ~/.local/bin/bbasm --l /tmp/xc7a100t.bba ~/fpga/chipdb/xc7a100tcsg324-1.bin
          fi
          # The if-branch above cd's into ~/nextpnr-xilinx, so relative paths no
          # longer point at the workspace -- my own bug, one layer deeper.
          mkdir -p "$GITHUB_WORKSPACE/build/fpga/chipdb"
          cp ~/fpga/chipdb/xc7a100tcsg324-1.bin "$GITHUB_WORKSPACE/build/fpga/chipdb/"
      
      - name: Generate bitstream
        run: |
          # t27c looks for nextpnr at a hardcoded build/ path; ours is in ~/.local/bin.
          # --device is EXPLICIT: the CLI default is the Wukong 200T board (SSOT), but
          # everything this job stages -- the Arty pin XDC, the generated chipdb, the
          # prjxray-db mapping -- is xc7a100tcsg324-1. The default flip landed as a
          # clean auto-merge and broke only at fasm2frames, the first step that looks
          # the part name up instead of trusting a path.
          ./target/release/t27c fpga-build --minimal --device xc7a100tcsg324-1 --nextpnr ~/.local/bin/nextpnr-xilinx
          ls -la build/fpga/
      
      - name: Bitstream metrics + flashing guide
        run: |
          # t27c names the bitstream after the top module (zerodsp_top.bit for the
          # minimal profile), not bitstream.bit -- the name this step used to demand.
          # A second upload step with the same artifact name was also removed: v4
          # errors on duplicate names, so it could only pass while the first upload
          # found nothing.
          echo "## FPGA Bitstream Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          BIT=$(ls build/fpga/*.bit 2>/dev/null | head -1)
          if [ -n "$BIT" ]; then
            size=$(wc -c < "$BIT" | tr -d ' ')
            echo "| Bitstream | $(basename "$BIT") |" >> $GITHUB_STEP_SUMMARY
            echo "| Bitstream size | $size bytes |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | Generated |" >> $GITHUB_STEP_SUMMARY
            echo "| Board | QMTECH XC7A100T |" >> $GITHUB_STEP_SUMMARY
            echo "| Profile | minimal |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | Failed |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          cat > build/fpga/FLASHING.md <<'EOF'
          # Flashing Guide
          ## QMTECH XC7A100T
          t27c fpga-flash --board qmtech-a100t --profile minimal
          ## Arty A7
          t27c fpga-flash --board arty-a7 --profile minimal
          ## Verify
          See docs/fpga/QMTECH_A100T_SMOKE.md for board-level smoke test.
          EOF
          sed -i 's/^          //' build/fpga/FLASHING.md

      - name: Upload bitstream + flashing guide
        uses: actions/upload-artifact@v4
        with:
          name: fpga-bitstream-${{ github.sha }}
          path: |
            build/fpga/*.bit
            build/fpga/FLASHING.md
          retention-days: 7

  fpga-formal:
    # A hung apt step ran 6h0m16s to the GitHub ceiling on 2026-08-18 and
    # read as a red PR whose own steps were all skipped (#2214).
    timeout-minutes: 45
    needs: fpga-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fpga-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fpga-

      - name: Install Yosys + SymbiYosys
        run: |
          # apt on a dead mirror HANGS (no error): five jobs burned whole 45-90m
          # ceilings on Install steps 2026-08-19. Bound each attempt, retry, fail fast.
          for i in 1 2 3; do
            timeout 420 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
              && timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 yosys \
              && break
            echo "::warning::apt attempt $i failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done
          # SymbiYosys is not on PyPI as 'sby' -- pip has failed here on every run
          # since the job existed (#2214). Install from source; it is pure Python plus
          # a Makefile. smtbmc engines need an SMT solver: z3 from apt.
          for i in 1 2 3; do
            timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 z3 && break
            echo "::warning::apt attempt $i (z3) failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install

      - name: Build t27c
        run: cargo build --release -p t27c

      - name: Download generated Verilog
        uses: actions/download-artifact@v4
        with:
          name: fpga-verilog
          path: build/fpga/generated/

      - name: Formal verification (MAC + FIFO + UART)
        run: |
          echo "## Formal Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Solver | Task | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|------|--------|" >> $GITHUB_STEP_SUMMARY
          # Audit 2026-08-19: without pipefail the if tested tee's exit (always 0),
          # so PASS was recorded unconditionally and the FAIL branch was unreachable.
          set -o pipefail
          if command -v sby &>/dev/null; then
            cp -r contrib/formal build/fpga/formal
            # FRESH generated RTL first: specs/fpga/*.v are April-vintage committed
            # copies (translate_off comments the current emitter no longer writes)
            # and shadowed the just-built artifact -- sby then died on TOK_INITIAL
            # in RTL four months older than the compiler that was supposedly under
            # test. Stale fallback is loud; absence is fatal.
            for m in mac fifo uart; do
              if [ -f "build/fpga/generated/${m}.v" ]; then
                cp "build/fpga/generated/${m}.v" build/fpga/formal/
              elif [ -f "specs/fpga/${m}.v" ]; then
                echo "::warning::formal uses STALE committed specs/fpga/${m}.v (generated artifact missing)"
                cp "specs/fpga/${m}.v" build/fpga/formal/
              else
                echo "::error::no ${m}.v available for formal (neither generated nor committed)"
                exit 1
              fi
            done
            for sby_file in build/fpga/formal/*.sby; do
              module_name=$(basename "$sby_file" .sby)
              echo "Running formal: $module_name"
              # sby resolves [files] against the INVOCATION cwd, not the .sby
              # location -- run from the formal dir so local paths bind.
              if (cd build/fpga/formal && sby -f "${module_name}.sby" 2>&1 | tee "${module_name}.log"); then
                echo "| $module_name | Z3 | BMC+prove | PASS |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $module_name | Z3 | BMC+prove | FAIL/UNKNOWN |" >> $GITHUB_STEP_SUMMARY
                echo "::error::Formal verification of $module_name did not pass"
                formal_failed=1
              fi
            done
            # A refusal on the record beats a vacuous green (repo doctrine, NOW.md).
            [ "${formal_failed:-0}" = "1" ] && exit 1
          else
            echo "| (all) | SymbiYosys not installed | - | SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "::warning::SymbiYosys (sby) not available, formal check skipped"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload formal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-formal
          path: build/fpga/formal/
          retention-days: 7

  fpga-conformance:
    # A hung apt step ran 6h0m16s to the GitHub ceiling on 2026-08-18 and
    # read as a red PR whose own steps were all skipped (#2214).
    timeout-minutes: 45
    needs: fpga-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fpga-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fpga-

      - name: Install Icarus Verilog
        run: |
          # apt on a dead mirror HANGS (no error): five jobs burned whole 45-90m
          # ceilings on Install steps 2026-08-19. Bound each attempt, retry, fail fast.
          for i in 1 2 3; do
            timeout 420 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
              && timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 iverilog \
              && break
            echo "::warning::apt attempt $i failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done

      - name: Build t27c
        run: cargo build --release -p t27c

      - name: Download generated Verilog
        uses: actions/download-artifact@v4
        with:
          name: fpga-verilog
          path: build/fpga/generated/

      - name: Generate conformance testbenches
        run: |
          echo "## FPGA Conformance Vectors" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Vector File | Module | Vectors | Invariants | Verdict |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|---------|------------|---------|" >> $GITHUB_STEP_SUMMARY
          pass=0
          fail=0
          for jf in conformance/fpga_*.json; do
            module=$(python3 -c "import json; d=json.load(open('$jf')); print(d.get('module','?'))" 2>/dev/null || echo "?")
            nvecs=$(python3 -c "import json; d=json.load(open('$jf')); v=d.get('vectors',{}); print(sum(len(v2.get('cases',[])) for v2 in v.values()))" 2>/dev/null || echo "0")
            ninv=$(python3 -c "import json; d=json.load(open('$jf')); print(len(d.get('invariants',[])))" 2>/dev/null || echo "0")
            verdict=$(python3 -c "import json; d=json.load(open('$jf')); print(d.get('verdict','?'))" 2>/dev/null || echo "?")
            echo "| $(basename $jf) | $module | $nvecs | $ninv | $verdict |" >> $GITHUB_STEP_SUMMARY
            if [ "$verdict" = "CLEAN" ]; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** $pass passed, $fail failed" >> $GITHUB_STEP_SUMMARY

      - name: Elaboration errors may fall, never rise
        run: |
          # #2325: 573 -> 186 across three emitter classes in one evening. The
          # conformance job executes two modules; the other thirty are only
          # yosys-linted, and yosys accepts many references iverilog rejects --
          # so without this ratchet the win can slide back invisibly.
          python3 tools/check_elab_ratchet.py

      # T88: the ratchet's own control. Plants a NEW module, a GONE module and a
      # BETTER one against a stub iverilog, and asserts each is named by its own
      # class while its neighbours stay silent -- the GONE and BETTER directions
      # share an exit code, so a code-only assertion cannot tell them apart.
      - name: Elaboration ratchet must go red (negative control)
        run: python3 tools/check_elab_ratchet.py --self-check

      # A gate nobody has seen fail is not a gate. This plants each failing
      # class in a temp tree -- data lost, file emptied, file corrupted, file
      # deleted, a new prose-only file, an unrecorded gain -- and runs the whole
      # gate against it through T27_VECTOR_ROOT, asserting the MESSAGE of the
      # branch and the ABSENCE of its neighbours. Mutation-tested: swallowing a
      # parse failure as (0, 0) again still exits 1, through EMPTIED, so an
      # exit-code-only control would stay green on exactly the T67 bug.
      - name: A vector case must carry data (negative control)
        run: python3 tools/check_vector_data.py --self-check

      - name: A vector case must carry data, not only prose
        run: |
          # #2241: 412 of 512 cases carry an id and a sentence and nothing else.
          # The 24 files that are entirely prose are frozen as debt; this fails
          # when a NEW one lands, so the class cannot grow again unnoticed.
          python3 tools/check_vector_data.py

      - name: Execute conformance vectors (iverilog + vvp)
        run: |
          # #2241 v1: the job now EXECUTES vectors instead of compiling
          # everything and running nothing. Doctrine as formal v1: a thin gate
          # that is real beats a broad one that is vacuous. The compile+run set
          # is the executed-vector registry in tools/run_conformance_vvp.py
          # (mac today); every module and group outside it is printed as debt,
          # never silently counted as covered.
          # #2415: without pipefail the `if` below tests tee's exit status, not
          # the runner's -- so a MISMATCH printed one line above was reported as
          # "EXECUTED, all cases passed" and the job stayed green. Same defect
          # #2242 removed from fpga-formal; the corrected pattern is ~115 lines
          # above in this file.
          set -o pipefail
          echo "## Conformance Vector Execution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          mkdir -p build/fpga/conformance
          fails=0
          for m in mac spi; do
            v="build/fpga/generated/${m}.v"
            if [ ! -f "$v" ]; then
              echo "::error::generated ${m}.v missing"; fails=$((fails+1)); continue
            fi
            if python3 tools/run_conformance_vvp.py "$m" "$v" build/fpga/conformance | tee "build/fpga/conformance/${m}.log"; then
              echo "| $m | EXECUTED, all cases passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $m | FAILED (see log) |" >> $GITHUB_STEP_SUMMARY
              fails=$((fails+1))
            fi
          done
          # Debt inventory: modules with vector files but no executed groups yet.
          total_json=$(ls conformance/fpga_*.json | wc -l | tr -d ' ')
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Vector files: $total_json; executed modules: 1 (registry v1). The" >> $GITHUB_STEP_SUMMARY
          echo "remainder is open work in #2241 -- displayed, not counted as covered." >> $GITHUB_STEP_SUMMARY
          [ "$fails" -gt 0 ] && { echo "::error::conformance execution failed"; exit 1; }
          echo "conformance: executed set green"

      - name: Validate conformance JSON structure
        run: |
          echo "## Conformance Schema Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pass=0
          fail=0
          for jf in conformance/fpga_*.json; do
            has_module=$(python3 -c "import json; d=json.load(open('$jf')); print('yes' if 'module' in d else 'no')")
            has_vectors=$(python3 -c "import json; d=json.load(open('$jf')); print('yes' if 'vectors' in d else 'no')")
            has_verdict=$(python3 -c "import json; d=json.load(open('$jf')); print('yes' if 'verdict' in d else 'no')")
            if [ "$has_module" = "yes" ] && [ "$has_vectors" = "yes" ] && [ "$has_verdict" = "yes" ]; then
              pass=$((pass+1))
            else
              echo "::warning::$(basename $jf) missing: module=$has_module vectors=$has_vectors verdict=$has_verdict"
              fail=$((fail+1))
            fi
          done
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Valid schema | $pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Invalid schema | $fail |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Power analysis regression
        run: |
          echo "## Power Analysis Regression" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Uses specs/fpga/power_analysis.t27 device limits:" >> $GITHUB_STEP_SUMMARY
          echo "| Device | Max LUTs | Max FFs | Max BRAMs | Max DSPs |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|---------|-----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| XC7A100T | 63400 | 126800 | 135 | 240 |" >> $GITHUB_STEP_SUMMARY
          echo "| XC7A35T | 20800 | 41600 | 50 | 90 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Budget: 2000mW typical, warning at 80%, critical at 95%" >> $GITHUB_STEP_SUMMARY

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-conformance
          path: build/fpga/conformance/
          retention-days: 7

  fpga-report:
    # A hung apt step ran 6h0m16s to the GitHub ceiling on 2026-08-18 and
    # read as a red PR whose own steps were all skipped (#2214).
    timeout-minutes: 45
    needs: [fpga-smoke, fpga-lint, fpga-synthesis, fpga-synthesis-arty, fpga-formal, fpga-conformance, fpga-bitstream]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## FPGA E2E Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke (gen-only) | ${{ needs.fpga-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          # "Lint (all 31 modules)" over-claimed twice: the artifact holds 32 files,
          # and the job is parse + hierarchy, not elaboration (#2326). This row is
          # the only fpga-lint status most readers of the run page see.
          echo "| Lint: parse + hierarchy, 32 modules (function bodies NOT elaborated -- see #2326) | ${{ needs.fpga-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Synthesis QMTECH (Yosys) | ${{ needs.fpga-synthesis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Synthesis Arty A7 (Yosys) | ${{ needs.fpga-synthesis-arty.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Conformance (vectors + TB) | ${{ needs.fpga-conformance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Formal (SymbiYosys) | ${{ needs.fpga-formal.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bitstream (E2E) | ${{ needs.fpga-bitstream.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Toolchain: Yosys + nextpnr-xilinx + prjxray + sby + t27c (Rust) | Zero Vivado | Boards: QMTECH + Arty A7 | Profile: minimal" >> $GITHUB_STEP_SUMMARY
