name: Emit Bit-Exact Gate (CI-02)

# Turns the one-off proof into an invariant: the programmable trainer's GENERATED
# microsequencer RTL must stay bit-exact to the Python GF-T model over a full
# training run (forward + backprop + weight update). Regenerates the GF-T cores
# fresh from their .t27 specs (per L2 GENERATION, gen/ is never hand-committed),
# emits the microsequencer for several topologies, and cross-checks every output
# per step in Icarus Verilog. It ALSO synthesizes the emitted RTL with yosys
# (synth_xilinx) and asserts a non-zero FF+LUT mapping, so a change that stays
# bit-exact in sim but breaks synthesizability also fails here -- instead of
# silently miscomputing (or failing to build a bitstream) on silicon.

on:
  pull_request:
    # No `branches:` filter on pull_request, deliberately. A branch filter makes
    # this gate silent on any PR whose base is not listed -- a stacked PR then
    # shows a green check list that a master-based PR would not get. Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below, where one
    # exists, is left alone: restricting post-merge runs is a cost decision.
    paths:
      # The four backends this gate proves equivalent all live in ONE file,
      # bootstrap/src/compiler.rs -- gen_zig:3437, gen_verilog:6741, gen_c:10522,
      # gen_rust:14382, in 31,077 lines. Without bootstrap/** here, a PR that
      # rewrites the C emitter merges with the cross-target proof never running.
      - "bootstrap/**"
      - "cli/**"
      - "tools/check_specs_parse.py"
      - "tools/check_specs_generate.py"
      # T77: the LEDGER, not just the script that reads it. Without this, the
      # PR the gate's own NOTE tells you to open -- the one that edits
      # specs_generate_baseline.txt -- does not run the gate that validates it.
      - "tools/specs_generate_baseline.txt"
      - "specs/**"
      - "tools/verify_exhaustive.py"
      - "tools/check_duplicate_agreement.py"
      - "specs/ternary/**"
      - "tools/gft_backprop_microcode.py"
      - "tools/verify_emit_bitexact.py"
      - "tools/verify_multitarget.py"
      - "tools/verify_trainer_c.py"
      - "tools/fuzz_trainer.py"
      - "tools/verify_igla_race.py"
      - "specs/igla/race/ternary_mac.t27"
      - "specs/igla/race/systolic_ternary.t27"
      - "specs/ternary/gft_smul.t27"
      - "specs/ternary/gft_sadd.t27"
      - ".github/workflows/emit-bitexact-gate.yml"
  workflow_dispatch:

jobs:
  emit-bitexact:
    runs-on: ubuntu-latest
    # 90, not 45: the cold-cache run (t27c build + full-tree scans + exhaustive
    # arms) legitimately takes ~46 min -- the 45 ceiling killed a healthy run on
    # 2026-08-19. A ceiling must clear the honest worst case, not the median.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Icarus Verilog + Yosys
        run: |
          # apt on a dead mirror HANGS (no error): five jobs burned whole 45-90m
          # ceilings on Install steps 2026-08-19. Bound each attempt, retry, fail fast.
          for i in 1 2 3; do
            timeout 420 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
              && timeout 600 sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::Retries=2 iverilog yosys \
              && break
            echo "::warning::apt attempt $i failed or hung; retrying in 45s"
            [ "$i" = 3 ] && { echo "::error::apt mirror unreachable after 3 bounded attempts"; exit 1; }
            sleep 45
          done

      - name: Build t27c
        run: cargo build --release -p t27c

      # Precondition for everything below. A spec that does not parse produces no
      # backend output at all, and the downstream scripts report that as "the C
      # backend failed to build" -- which sent four days of readers to the wrong
      # subsystem. Ask the parser first, and print its own message.
      - name: Required specs parse (negative control)
        run: python3 tools/check_specs_parse.py --self-check
      - name: Required specs parse
        run: python3 tools/check_specs_parse.py

      # 348 of 1114 specs do not generate with ANY backend -- 31.2% of what the
      # constitution calls the single source of truth. Not one is a backend mismatch:
      # on a 25-spec sample, zero generated with any of the four. They are recorded as
      # debt so this holds the line, and the number can only go down.
      - name: Every spec still generates (negative control)
        run: python3 tools/check_specs_generate.py --self-check
      - name: Every spec still generates
        run: python3 tools/check_specs_generate.py

      # Ternary primitives have input spaces small enough to enumerate: a full adder
      # over three trits-in-a-byte is 16,777,216 inputs, about a second of CPU. A space
      # you can exhaust needs neither a sample nor a prover, and docs/POSITIONING.md
      # names this as the one place the ternary choice buys a VERIFICATION advantage
      # rather than an area claim.
      - name: Exhaustive cross-target agreement (negative control)
        run: python3 tools/verify_exhaustive.py --self-check
      - name: Exhaustive cross-target agreement
        run: python3 tools/verify_exhaustive.py

      # tmul is defined in 14 specs, dot27 in 13, quantize in 9. Nothing checked that
      # the copies still compute the same thing, and copies drift. Compares BEHAVIOUR,
      # not text: hashing the source reported three "divergences" that were all
      # artefacts of the comparison rather than facts about the tree.
      - name: Duplicated functions agree (negative control)
        run: python3 tools/check_duplicate_agreement.py --self-check

      # T79: a SECOND control, on a different branch. --self-check exercises the
      # digest split; this exercises the drop join, where a copy the harness
      # cannot build against used to vanish with no output -- 6 of 36 pairs did.
      # Mutation-tested: neutering the drop accounting leaves --self-check green
      # and takes this one red; inverting the divergence verdict does the
      # opposite. Two controls, disjoint branches.
      - name: Duplicated functions agree (drop control)
        run: python3 tools/check_duplicate_agreement.py --self-check-drop
      - name: Duplicated functions agree
        run: python3 tools/check_duplicate_agreement.py

      - name: Prove generated RTL == GF-T model (bit-exact) + synthesizes
        run: python3 tools/verify_emit_bitexact.py

      - name: Prove GF-T primitives bit-exact across C + Rust + model
        run: python3 tools/verify_multitarget.py --require

      - name: Prove the WHOLE trainer bit-exact in C (== model == Verilog)
        run: python3 tools/verify_trainer_c.py --require

      - name: Prove the trainer LEARNS (XOR 4/4 + nonlinear held-out >=90%, incl. deep 3-layer)
        run: python3 tools/gft_backprop_microcode.py

      - name: Differential-fuzz the trainer (random topologies, edge inputs)
        run: python3 tools/fuzz_trainer.py 40 --require

      - name: Cross-check IGLA RACE ternary MAC (C + Rust == model)
        run: python3 tools/verify_igla_race.py
