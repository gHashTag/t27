name: Corpus Ratchet

# W632 (BLOCKING). The regression gate this repository did not have.
#
# Background: `t27c suite` reports TOTAL FAILURES in the thousands, and W626
# measured that a gate whose baseline is already non-zero cannot detect a
# regression -- a new break lands inside the total and moves the exit code not
# at all. Three end-to-end runs across three compiler builds all reported 2614,
# term for term.
#
# This job gates on `docs/reports/suite_expectations.json` instead: a set of
# (path, phase) identities over the hand-written corpus. The verdict is
# observed-versus-expected PER IDENTITY, so it moves when something changes.
#
#   UNEXPECTED FAILURE -- a corpus spec failed that is not in the ledger.
#   UNEXPECTED PASS    -- a ledger entry passed. Also a failure: without this
#                         the ledger is monotone and rots (see T33).
#   EXPIRED            -- an entry is past its `expires` date.
#   OVER CAP           -- the ledger outgrew `max_entries`, which only ever
#                         moves down. Raising it is a hand edit in the PR.
#
# `--corpus-only` excludes `specs/scratch/`, which is 606,113,688 of the
# 612,924,235 bytes the full walk covers (98.89%) and is generator output the
# ratchet does not gate on anyway. Measured: 314 s vs 4057 s, with a
# bit-identical verdict (T40). That is what makes this a per-PR check rather
# than a nightly nobody reads.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: corpus-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    name: Corpus ratchet (expected-failure ledger)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ratchet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ratchet-

      - name: Build t27c
        run: cargo build --release -p t27c

      # Closes #2288. `cargo build` does not compile `#[cfg(test)]` modules, so
      # eight workflows on master build t27c and not one of them ever compiled,
      # let alone ran, a single test in it. Measured 2026-08-20: 1221 tests
      # exist and 1221 of them had never executed in CI. They all pass -- so
      # this lands as a plain gate, not a ratchet.
      #
      # It goes here because the crate is already built one step above, so the
      # marginal cost is compiling the test targets and running them: measured
      # 1m43s cold / 1.75s warm, against this job's 45-minute ceiling and its
      # ~314s ratchet run.
      #
      # Scope, stated openly -- this runs what `cargo test -p t27c` REACHES,
      # which is not every test in the tree. 913 `#[test]` attributes live in
      # bootstrap/src; 895 compile into this run. The missing 18:
      #   * bootstrap/src/math_compare.rs -- 10 tests, and no `mod math_compare;`
      #     exists anywhere in the crate, so rustc never opens the file. Built
      #     standalone it is 9 pass / 1 fail (see #2288 follow-up); the failure
      #     is a bad assertion, not a bad implementation, so it is NOT silenced
      #     here and NOT wired in here -- wiring it in would land this gate red.
      #   * bootstrap/src/proxy.rs -- 8 tests behind
      #     `#[cfg(all(test, feature = "server"))]`. No workflow passes
      #     `--features server`, so they are stripped before type-checking.
      # Neither hole is created by this step; both are named so the green tick
      # is not read as "every test in bootstrap/src ran".
      - name: Unit tests (cargo test -p t27c)
        id: unit_tests
        run: |
          set -o pipefail
          cargo test -p t27c --release 2>&1 | tee unit_tests.log
          rc=$?
          totals=$(grep -E '^test result:' unit_tests.log \
            | awk '{p+=$4; f+=$6; i+=$8} END {printf "%d passed, %d failed, %d ignored", p, f, i}')
          bins=$(grep -cE '^test result:' unit_tests.log)
          echo ""
          echo "t27c unit tests: ${totals} across ${bins} test binaries."
          {
            echo "### t27c unit tests"
            echo ""
            echo "\`cargo test -p t27c --release\` -- **${totals}** across ${bins} test binaries."
            echo ""
            echo "Not covered: 10 tests in \`bootstrap/src/math_compare.rs\` (no \`mod\` declaration"
            echo "anywhere, so rustc never compiles the file) and 8 in \`bootstrap/src/proxy.rs\`"
            echo "(behind \`feature = \"server\"\`, which no workflow enables)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Explain a unit-test failure
        if: failure() && steps.unit_tests.outcome == 'failure'
        run: |
          echo "::error title=t27c unit tests failed::A Rust test in the t27c crate failed."
          echo ""
          echo "This is NOT the corpus ratchet and has nothing to do with"
          echo "docs/reports/suite_expectations.json. Do not bless an expectation for it."
          echo ""
          echo "Reproduce locally with:"
          echo "    cargo test -p t27c --release"
          echo ""
          echo "The failing test names are in the step log above and in the"
          echo "corpus-ratchet-log artifact (unit_tests.log)."

      - name: Run the corpus ratchet
        id: ratchet
        run: |
          set -o pipefail
          # Redirect rather than pipe: `tail` buffers to end-of-stream and makes
          # a working tool look silent for the whole run (T26).
          ./target/release/t27c suite --repo-root . --ratchet --corpus-only \
            --json suite_summary.json > ratchet.log 2>&1
          rc=$?
          sed -n '/--- Ratchet (W628) ---/,$p' ratchet.log
          exit $rc

      # Scoped to the ratchet step. A bare `failure()` here fires for ANY earlier
      # failure, so once a unit-test step exists above it, a failing Rust test
      # would print "add an entry to suite_expectations.json" -- sending the
      # reader to bless a corpus expectation for a defect that is not in the
      # corpus. The guard keeps each failure explained by its own step.
      - name: Explain a failure
        if: failure() && steps.ratchet.outcome == 'failure'
        run: |
          echo "::error title=Corpus ratchet failed::See the Ratchet section above."
          echo ""
          echo "UNEXPECTED FAILURE -> a corpus spec broke. Fix it, or, if the break"
          echo "  is intended and tracked, add an entry to"
          echo "  docs/reports/suite_expectations.json by hand with a real reason,"
          echo "  an issue number and an expires date -- and raise max_entries in"
          echo "  the same commit, which is the reviewable event."
          echo ""
          echo "UNEXPECTED PASS -> you fixed something. Remove its entry and lower"
          echo "  max_entries to the new size. Regenerate with:"
          echo "    ./target/release/t27c suite --repo-root . --bless-expectations"
          echo "  then review the diff before committing it."
          echo ""
          echo "EXPIRED -> the amnesty ran out. Fix the spec or renew the date"
          echo "  with a reason in the PR description."

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-ratchet-log
          path: |
            ratchet.log
            suite_summary.json
            unit_tests.log
          retention-days: 14
