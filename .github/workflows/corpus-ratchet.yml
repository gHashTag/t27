name: Corpus Ratchet

# W632 (BLOCKING). The regression gate this repository did not have.
#
# Background: `t27c suite` reports TOTAL FAILURES in the thousands, and W626
# measured that a gate whose baseline is already non-zero cannot detect a
# regression -- a new break lands inside the total and moves the exit code not
# at all. Three end-to-end runs across three compiler builds all reported 2614,
# term for term.
#
# This job gates on `docs/reports/suite_expectations.json` instead: a set of
# (path, phase) identities over the hand-written corpus. The verdict is
# observed-versus-expected PER IDENTITY, so it moves when something changes.
#
#   UNEXPECTED FAILURE -- a corpus spec failed that is not in the ledger.
#   UNEXPECTED PASS    -- a ledger entry passed. Also a failure: without this
#                         the ledger is monotone and rots (see T33).
#   EXPIRED            -- an entry is past its `expires` date.
#   OVER CAP           -- the ledger outgrew `max_entries`, which only ever
#                         moves down. Raising it is a hand edit in the PR.
#
# `--corpus-only` excludes `specs/scratch/`, which is 606,113,688 of the
# 612,924,235 bytes the full walk covers (98.89%) and is generator output the
# ratchet does not gate on anyway. Measured: 314 s vs 4057 s, with a
# bit-identical verdict (T40). That is what makes this a per-PR check rather
# than a nightly nobody reads.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    name: Corpus ratchet (expected-failure ledger)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ratchet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ratchet-

      - name: Build t27c
        run: cargo build --release -p t27c

      # A `cargo test -p t27c` step lived here for 34 minutes on 2026-08-20
      # (ce6ea628b) and is removed again by #2292. It was landed on a measurement
      # of 1221 passing tests taken in a working tree checked out at
      # feat/wave-547/host-heapsort, NOT at master -- that branch's
      # bootstrap/src/compiler.rs is 22,142 lines against master's 36,970. On
      # master the same command is 1602 passed / 13 failed / 2 ignored, so the
      # step went red on its first run here.
      #
      # It should come back as a RATCHET over the 13 named in #2292, never as a
      # plain gate: a gate that lands red gets disabled rather than obeyed.
      # Do not re-add it without a measurement taken on master.

      # W706: the type-conflict ledger lives here and not in `cli-tri.yml`,
      # which has a `paths:` filter on `cli/**`. A NEW conflicting struct arrives
      # in `specs/**`, so the gate that could catch it would not have run --
      # the exact shape this repository has been bitten by before. This workflow
      # has no paths filter and already runs on every push and pull request.
      - name: Build tri
        run: cargo build -p tri

      - name: A type name may not gain a second definition
        run: |
          set -o pipefail
          rc=0
          ./target/debug/tri types ratchet > /tmp/types.log 2>&1 || rc=$?
          cat /tmp/types.log
          if [ "$rc" != "0" ]; then
            echo "::error::the set of conflicted type names moved. A name with two"
            echo "::error::definitions has no computable domain size -- not because the type"
            echo "::error::is infinite but because WHICH type is undetermined (#2774)."
            echo "::error::If the change is deliberate: tri types ratchet --bless"
          fi
          exit $rc

      # The ratchet above holds the SET of conflicted names. It cannot tell
      # whether anyone has READ them. docs/TYPE_CONFLICTS.md splits every one
      # into DRIFT (one concept, two definitions) or DISTINCT (two concepts,
      # one name) with the reading that decided it -- and a written reading of
      # a tree is exactly the kind of claim that quietly stops being true.
      #
      # Both directions fail here, deliberately. An UNJUDGED name is a conflict
      # nobody has looked at; a STALE row is a document describing a repair
      # that already landed. Only one of those feels like a failure, and
      # treating the other as a pass is how a document becomes decoration.
      - name: Every conflicted type name has a written verdict
        run: |
          set -o pipefail
          rc=0
          ./target/debug/tri types classified > /tmp/classified.log 2>&1 || rc=$?
          cat /tmp/classified.log
          if [ "$rc" != "0" ]; then
            echo "::error::docs/reports/type_conflicts_classified.json disagrees with the tree."
            echo "::error::UNJUDGED means a new conflict nobody has read; STALE means a row"
            echo "::error::about a name that is no longer conflicting. Read it, then edit the"
            echo "::error::json and the tables in docs/TYPE_CONFLICTS.md to match."
          fi
          exit $rc

      - name: Run the corpus ratchet
        id: ratchet
        run: |
          set -o pipefail
          # Redirect rather than pipe: `tail` buffers to end-of-stream and makes
          # a working tool look silent for the whole run (T26).
          #
          # `|| rc=$?` and not a bare call: a `run:` block with no `shell:` key
          # executes under `bash -e`, so a failing command aborts the step where it
          # stands. With a bare call the `rc=$?`, the `sed` and the `exit $rc` below
          # were dead code on precisely the path they exist for -- this step printed
          # its exit code and nothing else for its entire history, and the verdict
          # reached a reader only through the uploaded artifact. A command on the
          # left of `||` is not an `-e` abort point, so the tail of this script runs
          # and `exit $rc` still carries the outcome unchanged. Closes #2314.
          rc=0
          ./target/release/t27c suite --repo-root . --ratchet --corpus-only \
            --json suite_summary.json > ratchet.log 2>&1 || rc=$?
          # A crash before the verdict leaves no Ratchet section behind. Say so and
          # show the tail, rather than falling back to a bare exit code again.
          verdict=$(sed -n '/--- Ratchet (W628) ---/,$p' ratchet.log || true)
          if [ -n "$verdict" ]; then
            printf '%s\n' "$verdict"
          else
            echo "ratchet.log has no '--- Ratchet (W628) ---' section, so the run"
            echo "ended before the verdict. Its last 40 lines follow; the whole file"
            echo "is in the corpus-ratchet-log artifact."
            tail -40 ratchet.log 2>&1 || true
          fi
          exit $rc

      # Scoped to the ratchet step. A bare `failure()` here fires for ANY earlier
      # failure, so once a unit-test step exists above it, a failing Rust test
      # would print "add an entry to suite_expectations.json" -- sending the
      # reader to bless a corpus expectation for a defect that is not in the
      # corpus. The guard keeps each failure explained by its own step.
      - name: Explain a failure
        if: failure() && steps.ratchet.outcome == 'failure'
        run: |
          echo "::error title=Corpus ratchet failed::See the Ratchet section above."
          echo ""
          echo "UNEXPECTED FAILURE -> a corpus spec broke. Fix it, or, if the break"
          echo "  is intended and tracked, add an entry to"
          echo "  docs/reports/suite_expectations.json by hand with a real reason,"
          echo "  an issue number and an expires date -- and raise max_entries in"
          echo "  the same commit, which is the reviewable event."
          echo ""
          echo "UNEXPECTED PASS -> you fixed something. Remove its entry and lower"
          echo "  max_entries to the new size. Regenerate with:"
          echo "    ./target/release/t27c suite --repo-root . --bless-expectations"
          echo "  then review the diff before committing it."
          echo ""
          echo "EXPIRED -> the amnesty ran out. Fix the spec or renew the date"
          echo "  with a reason in the PR description."

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-ratchet-log
          path: |
            ratchet.log
            suite_summary.json
          retention-days: 14
