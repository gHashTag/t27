name: Brain Seal Refresh

on:
  push:
    branches: [master]
    paths:
      - '.trinity/experience/**'
      - 'scripts/aggregate-experience.sh'
  workflow_dispatch:

# `contents: read` since the step that needed write was removed below. The
# artifact upload does not need it, and checkout needs only read.
permissions:
  contents: read
  pull-requests: write

jobs:
  refresh-brain-seals:
    runs-on: ubuntu-latest
    name: Refresh Brain Seals from Experience

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run experience aggregation
        run: |
          bash scripts/aggregate-experience.sh .

      - name: Validate brain seals
        run: |
          python3 << 'EOF'
          import json
          from jsonschema import validate

          # Validate against BRAIN_SEAL_SCHEMA
          schema = json.load(open('conformance/BRAIN_SEAL_SCHEMA.json'))

          for seal_file in ['.trinity/seals/brain_summary.json', '.trinity/seals/brain_domains.json']:
              instance = json.load(open(seal_file))
              validate(instance=instance, schema=schema)
              print(f"{seal_file}: VALID")
          EOF

      - name: Upload brain seals
        uses: actions/upload-artifact@v4
        with:
          name: brain-seals
          path: .trinity/seals/brain_*.json

      - name: Create branch, commit, and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="brain-seal-refresh/$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git add .trinity/seals/brain_*.json
          git commit -F - <<'EOF'
chore: refresh brain seals from experience aggregation
Auto-generated by brain-seal-refresh workflow
Closes #2915
EOF
          git push origin "$BRANCH_NAME"
          gh pr create --title "chore: refresh brain seals from experience aggregation" \
                       --body "Auto-generated PR to refresh brain seals from experience aggregation. This PR is created by the brain-seal-refresh workflow. Closes #2915" \
                       --head "$BRANCH_NAME" \
                       --base master \
                       --label "automated"