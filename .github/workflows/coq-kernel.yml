name: Coq kernel
on:
  push:
    paths:
      - 'coq/**'
      - 'proofs/**'
      - 'tools/check_coq_in_build.py'
      - 'tools/coq_outside_build_baseline.txt'
      - '.github/workflows/coq-kernel.yml'
      # The IEEE 754 literal gate (#2324) lives in the Rust binary, not under
      # coq/. Without this path the gate's own source could be edited into a
      # no-op and no run would notice, because nothing under coq/ changed.
      - 'bootstrap/src/phi_f64_literals.rs'
  pull_request:
    # No `branches:` filter on pull_request, deliberately. A branch filter makes
    # this gate silent on any PR whose base is not listed -- a stacked PR then
    # shows a green check list that a master-based PR would not get. Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below, where one
    # exists, is left alone: restricting post-merge runs is a cost decision.
    paths:
      - 'coq/**'
      - 'proofs/**'
      - 'tools/check_coq_in_build.py'
      - 'tools/coq_outside_build_baseline.txt'
      - '.github/workflows/coq-kernel.yml'
      - 'bootstrap/src/phi_f64_literals.rs'
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.19-ocaml-4.14-flambda
      options: --user root
    # This image ships a fully initialised opam root, but it belongs to the
    # image's `coq` user and lives at /home/coq/.opam. `--user root` above makes
    # HOME=/root, so a bare `opam` looked for /root/.opam, found nothing, and
    # exited 50 with "Opam has not been initialised" -- on every run since the
    # workflow was added. Point every step at the root that actually exists.
    #
    # Deliberately NOT `opam init`: a fresh root has no Coq in it, so
    # `opam install coq-flocq` would rebuild the whole compiler, and the coqc /
    # coqchk already on PATH would still come from the image's switch. Reusing
    # the image's root also inherits its sandbox-disabled config, which is what
    # `--disable-sandboxing` would otherwise be needed for.
    env:
      OPAMROOT: /home/coq/.opam
    steps:
      - uses: actions/checkout@v6

      - name: Install Flocq (opam)
        run: |
          set -eux
          # Echo which root/switch resolved, so a future failure here says why
          # instead of just exiting 50.
          opam var root
          opam switch list
          opam update -y
          opam install -y coq-flocq

      - name: Build coq/ (T27 + Flocq)
        run: |
          set -eux
          eval $(opam env)
          coqc --version
          cd coq
          coq_makefile -f _CoqProject -o CoqMakefile
          make -f CoqMakefile -j$(nproc)

      - name: coqchk PhiFloat (consistency)
        run: |
          set -eux
          eval $(opam env)
          cd coq
          coqchk -silent -R . T27 T27.Kernel.PhiFloat

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build t27c, validate the L5 phi identity, check PhiFloat.v vs IEEE 754
        run: |
          set -eux
          # `bootstrap` is a member of the ROOT cargo workspace, so the binary
          # lands in the workspace target dir at the repo root -- never in
          # bootstrap/target/. The old `cd bootstrap && cargo build --release`
          # followed by `./target/release/t27c` resolved to
          # bootstrap/target/release/t27c, which cannot exist (exit 127). This
          # step had never once executed, so the bad path was never observed.
          #
          # The subcommand is `validate-phi-identity`. `validate-phi` has never
          # existed in t27c, and clap exited 2 on it the very first time this
          # step ran at all -- run 32477122735, once #2320 unblocked step 4 and
          # #2322 unblocked step 5.
          #
          # TWO checks run here, and they are not interchangeable.
          #
          # 1. `validate-phi-identity` -- the L5 invariant phi^2 + phi^-2 = 3
          #    evaluated in f64. It computes phi itself and never opens
          #    coq/Kernel/PhiFloat.v, so it holds whatever that file says. It
          #    cannot detect drift in the literals; that is why #2322 renamed
          #    this step down rather than let the old name ("validate phi f64
          #    parameters") launder it.
          #
          # 2. `validate-phi-f64-literals` -- the check the old name promised,
          #    added by #2324. It reads phi_mantissa / phi_exponent /
          #    one_mantissa / one_exponent OUT of coq/Kernel/PhiFloat.v and
          #    compares each against parameters decoded from doubles computed in
          #    Rust from (1 + sqrt 5) / 2 and 1.0 -- not against constants copied
          #    from the Coq file, which would be a tautology. Until it existed,
          #    a typo in a mantissa sailed through: scripts/validate_phi_f64.py
          #    only prints the parameters (its lone assert is an internal
          #    round-trip) and always exits 0, and the Coq lemma
          #    phi_f64_bounded proves only that the pair is a *canonical*
          #    binary64, not that it is phi.
          #
          # Both are under `set -eux`; neither is allowed to fail open.
          cargo build --release -p t27c
          ./target/release/t27c validate-phi-identity
          ./target/release/t27c validate-phi-f64-literals

      # The Kernel PHI check above reads two files. Zero Admitted there is true
      # and says nothing about the other 56 Coq files: 41 are in a _CoqProject
      # and carry 234 Qed with zero Admitted, and 18 are in none and hold all 32
      # Admitted in the repository (#3153). This does not fix that -- it pins the
      # 18 so a nineteenth cannot arrive unnoticed.
      #
      # The paths: filter above was widened to proofs/** in the same commit,
      # because a gate whose trigger is narrower than its subject is the shape
      # this pass spent its time measuring.
      - name: No new Coq file falls outside every build
        run: |
          set -euo pipefail
          python3 tools/check_coq_in_build.py --self-check
          python3 tools/check_coq_in_build.py

      - name: Verify Kernel PHI layer has no Admitted
        run: |
          # `set -eu`, NOT `set -uo pipefail`. This job runs in the
          # coqorg/coq container, where the step shell is `sh -e` -- dash, which
          # rejects `-o pipefail` with "Illegal option" ON LINE 1, killing the step
          # before it reads a file. Every sibling step in this job uses `set -eux`;
          # this one was the only `-o pipefail`, and there is no pipeline here for
          # pipefail to guard.
          set -eu
          # GREP HAS THREE ANSWERS AND THIS USED TO KEEP ONE.
          #
          # 0 matched, 1 no match, 2 cannot open. The old line was
          #
          #     if grep -n 'Admitted' coq/Kernel/Phi.v coq/Kernel/PhiFloat.v 2>/dev/null; then
          #
          # and `if` merges 1 with 2, so a missing operand fell through to
          # "OK: no Admitted". Reproduced with coq/Kernel/Phi.v absent and one
          # `Admitted.` in PhiFloat.v: grep PRINTS the match, exits 2, and the
          # step prints OK underneath it and exits 0.
          #
          # That is one ordinary rename away. The path is pinned in more files
          # than a rename would think to touch -- `git grep -n 'Kernel/Phi\.v'`
          # lists them, and two are machine-readable conformance files, not
          # prose. Update them all, as any Coq rename must, and the build stays
          # green with this gate dead from that commit onward. None of the hits
          # is a Coq `Require`: those name the module T27.Kernel.Phi, which this
          # string cannot match, so grep cannot warn you about them.
          #
          # Exit 2 for "could not run", matching scripts/tri and
          # tools/check_now_entry_shape.py.
          #
          # An `[ -f ]` loop over the two operands was written first and then
          # REMOVED: mutation showed it redundant -- deleting it left every test
          # green, because the three-way case below already turns grep's 2 into
          # exit 2, and dropping `2>/dev/null` lets grep name the file it could
          # not open. Two rules with one testable consequence is one rule and a
          # decoration.
          # Three-way, with stderr kept. 2 is "cannot open" -- a missing file, a
          # permission, a directory -- and none of those is a clean file.
          # `set -e` is on -- GitHub runs a `run:` step under `bash -eo pipefail` --
          # and a plain `HITS=$(grep ...)` ABORTS THE STEP when grep exits 1, which is
          # the CLEAN case. `rc=$?` was never reached, the `case` below never ran, and
          # a healthy tree exited 1, indistinguishable from a real `Admitted.`.
          # Measured: this gate failed on every run from 2026-09-03T21:54 onward while
          # both files carried zero `Admitted`.
          #
          # A command in an `if` CONDITION is exempt from `set -e`, so its exit code
          # survives to be read. That is the whole fix; the three-way handling below is
          # unchanged and is what this gate was repaired to have.
          if HITS=$(grep -n 'Admitted' coq/Kernel/Phi.v coq/Kernel/PhiFloat.v); then
            rc=0
          else
            rc=$?
          fi
          case "$rc" in
            0)
              echo "$HITS"
              echo "ERROR: Admitted remains in Phi / PhiFloat" >&2
              exit 1
              ;;
            1)
              echo "OK: no Admitted in Phi.v or PhiFloat.v (both files read)"
              ;;
            *)
              echo "::error::this gate could not run: grep exited $rc." >&2
              echo "::error::Nothing was checked." >&2
              exit 2
              ;;
          esac
