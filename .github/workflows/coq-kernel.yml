name: Coq kernel
on:
  push:
    paths:
      - 'coq/**'
      - 'trios-coq/**'
      - '.github/workflows/coq-kernel.yml'
  pull_request:
    branches: [master]
    paths:
      - 'coq/**'
      - 'trios-coq/**'
      - '.github/workflows/coq-kernel.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.19-ocaml-4.14-flambda
      # Wall 1 (Prop. 171): the image runs as user `coq` against a root-owned
      # workspace mount, so checkout fails with EACCES on /__w/_temp. master
      # already carries this fix; this branch held a pre-fix copy. Taken from
      # master rather than hand-written.
      options: --user root
    steps:
      - uses: actions/checkout@v6

      # Wall 2 (Prop. 171): master gets past checkout and fails HERE with exit
      # 50 -- the runner injects HOME=/github/home while the image's opam root
      # is /home/coq/.opam. master does NOT have this fix.
      - name: Install Flocq (opam)
        env:
          OPAMROOT: /home/coq/.opam
        run: |
          opam update -y
          opam install -y coq-flocq

      - name: Build coq/ (T27 + Flocq)
        run: |
          eval $(opam env)
          cd coq
          coq_makefile -f _CoqProject -o CoqMakefile
          make -f CoqMakefile -j$(nproc)

      # Prop. 168: trios-coq/_CoqProject lists 30 files and NO workflow built
      # them -- 444 Qed. type-checked by nothing, including three added to that
      # project one wave earlier. It depends on coq/ being built first, which
      # the step above now guarantees.
      # NON-BLOCKING on arrival. This tree has never been built by CI, so its
      # Prop. 203: OBSERVED GREEN, and the flag is now off -- that flip was the
      # deliverable this step was waiting on. Measured 2026-08-13 with Rocq 9.2:
      # `coq_makefile -f _CoqProject && make` produces 28 of 28 .vo and exits 0,
      # after six mechanical defect classes were cleared (Props. 201-203).
      #
      # It was suspended for so long because a suspended check reports success
      # whether it is green or has been red for a year (Prop. 201), so nothing
      # ever said the condition had become satisfiable.
      #
      # CAVEAT, stated rather than hidden: green was measured on Rocq 9.2 on one
      # host. If CI resolves a different Coq version, enforcing this step is how
      # that gets discovered -- which is the point of enforcing it.
      - name: Build trios-coq/ (depends on coq/)
        run: |
          eval $(opam env)
          cd trios-coq
          coq_makefile -f _CoqProject -o CoqMakefile
          make -f CoqMakefile -j$(nproc)

      - name: coqchk PhiFloat (consistency)
        run: |
          eval $(opam env)
          cd coq
          coqchk -silent -R . T27 T27.Kernel.PhiFloat

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build t27c and validate phi f64 parameters
        run: |
          cd bootstrap && cargo build --release
          ./target/release/t27c validate-phi

      - name: Verify Kernel PHI layer has no Admitted
        run: |
          if grep -n 'Admitted' coq/Kernel/Phi.v coq/Kernel/PhiFloat.v 2>/dev/null; then
            echo "ERROR: Admitted remains in Phi / PhiFloat" >&2
            exit 1
          fi
          echo "OK: no Admitted in Phi.v or PhiFloat.v"
