name: secret-scan

# Block any PR or push that re-introduces plaintext private keys or
# accidentally re-commits the Solana test-validator runtime state.
#
# Triggered by R-SEC W105: contrib/solana/target/deploy/tri_mining-keypair.json
# and test-ledger/*-keypair.json were committed in plaintext.

on:
  push:
    branches: [master, main]
  pull_request:
    # No `branches:` filter on pull_request, deliberately. A branch filter makes
    # this gate silent on any PR whose base is not listed -- a stacked PR then
    # shows a green check list that a master-based PR would not get. Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below, where one
    # exists, is left alone: restricting post-merge runs is a cost decision.
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Block Solana keypair files anywhere in the tree
        run: |
          set -euo pipefail
          OFFENDERS=$(find . -type f \
            \( -name '*-keypair.json' -o -path '*/target/deploy/*.json' \) \
            -not -path './node_modules/*' \
            -not -path './.git/*')
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Plaintext keypair/deploy artefacts must not be committed:"
            echo "$OFFENDERS"
            exit 1
          fi

      - name: Block test-ledger runtime directory
        run: |
          set -euo pipefail
          if find . -type d -name 'test-ledger' -not -path './.git/*' | grep -q .; then
            echo "::error::Solana test-validator runtime directory test-ledger/ must not be committed."
            find . -type d -name 'test-ledger' -not -path './.git/*'
            exit 1
          fi

      - name: Block hardcoded /Users/playra/ paths
        run: |
          set -euo pipefail
          # This found 233 files and had been red for months, because the
          # workflow is paths-filtered and had not run. Of those, 60 were
          # load-bearing (seal spec_path fields the seal gate RESOLVES, and
          # scripts whose repository root could only be one person's) and were
          # fixed; 208 were committed Coq build artifacts and were untracked;
          # 98 were prose and are now repository-relative.
          #
          # Four files remain and are named, not swept under a count. Each
          # configures LOCAL TOOLING and must give an absolute path at run
          # time, so there is no portable literal to replace it with. They are
          # excluded deliberately and individually -- if these move to an
          # expanded variable, delete the line here with the change.
          #
          # Allowlist this very workflow file so the literal string is
          # permitted in the guard itself.
          # `./` is optional: GNU grep on the runner prints it, BSD grep on a
          # developer's Mac does not, and a filter anchored to one of them is
          # a rule that means different things in the two places it is run.
          ALLOWED='^(\./)?(\.github/workflows/secret-scan\.yml|tools/check_devhome_paths\.py|tools/devhome_baseline\.txt|\.mcp\.json|\.codex/config\.toml|\.codex/hooks\.json|\.claude/gitbutler-hooks\.json):'
          if grep -RIn --exclude-dir=.git --exclude='secret-scan.yml' \
              '/Users/playra/' . | grep -Ev "$ALLOWED"; then
            echo "::error::Hardcoded developer home path '/Users/playra/' found. Use git rev-parse --show-toplevel."
            exit 1
          fi

      - name: Block hardcoded developer home paths -- BOTH spellings
        run: |
          set -euo pipefail
          # The step above names ONE developer home. Measured 2026-08-29 there
          # are two in this repository, and the unguarded spelling appears in
          # SIX TIMES more files than the guarded one -- 33 against 5, and 28 of
          # the 33 are executable (.rs, .py, .sh). One of them WAS
          # bootstrap/src/service.rs, the compiler, cleaned the same day.
          # The current count is tools/devhome_baseline.txt, not this comment.
          #
          # A guard against a class that names one member of the class is the
          # shape this repository keeps finding, here in the guard written
          # against it.
          #
          # The existing debt is PINNED per file rather than fixed, because
          # landing a guard that fails on 33 files puts it back in the state the
          # step above describes: red for months, and therefore ignored. A new
          # occurrence fails; a file that grows fails; a file that shrinks fails
          # too, so the slack cannot be banked.
          python3 tools/check_devhome_paths.py
