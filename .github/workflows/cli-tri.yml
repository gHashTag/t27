# This repository has 35 workflows and, until this one, not a single one built
# the `tri` crate. The consequence was exactly what you would expect: `cargo
# build -p tri` on main failed because dlc10 embeds a bitstream with
# `include_bytes!` that was committed to a feature branch and never to main, so
# nobody could build the CLI from a clean checkout. An autonomous loop went on
# committing into cli/tri/src/ the whole time.
#
# A crate nothing builds is a crate nobody can use, and the breakage is silent
# because there is no signal to be red.
name: cli-tri

on:
  push:
    branches: [main, master]
    paths:
      - 'cli/**'
      - '.claude/skills/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # `tri census pin --gate` pins `gates quiet` and `gates shell`, whose
      # subject is this directory. A trigger narrower than the subject cannot
      # fire on the change it exists for -- and worse, the ledger would go
      # stale on a workflow-only commit and the NEXT cli/** commit would fail,
      # blaming an author who changed nothing. Priced over the last 200 commits
      # on master: 24 touch .github/workflows/, 2 of those already touch cli/,
      # so this adds this job on 22 of 200 commits (11%).
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'cli/**'
      - '.claude/skills/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # `tri census pin --gate` pins `gates quiet` and `gates shell`, whose
      # subject is this directory. A trigger narrower than the subject cannot
      # fire on the change it exists for -- and worse, the ledger would go
      # stale on a workflow-only commit and the NEXT cli/** commit would fail,
      # blaming an author who changed nothing. Priced over the last 200 commits
      # on master: 24 touch .github/workflows/, 2 of those already touch cli/,
      # so this adds this job on 22 of 200 commits (11%).
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # chips/phi is a gitlink (160000) to gHashTag/tt-trinity-phi, and
      # checkout's default is submodules: false -- so the directory the last
      # step points `tri rtl check` at was EMPTY on the runner, and the CLI died
      # with a bare "No such file or directory (os error 2)". The binary was
      # fine; it had nothing to read. That step had never executed once in this
      # workflow's history, because the two causes before it (#2303 yosys
      # ordering, #2305 dry_run_sweep_ok) aborted the job first.
      #
      # All three chips/* submodules are public, so the default GITHUB_TOKEN --
      # which is scoped to this repo alone -- can clone them; ~10.2 MB total.
      # None of the three has a nested .gitmodules, so `true` is the minimal
      # setting that works and `recursive` would buy nothing.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable

      # From a clean checkout, with nothing copied in by hand. That is the
      # condition that was broken and the only one worth asserting.
      - name: cargo build -p tri --all-targets
        # Tests are targets too. The plain build stayed green twice while the
        # test build was broken on master (#2227, #2236) -- every PR inherited
        # a break no gate reported. --all-targets closes that gap.
        run: cargo build -p tri --all-targets

      # yosys has to be on PATH BEFORE the tests, not after them. This install
      # used to sit inside the last step's run block, which is ordered after
      # `cargo test -p tri`, and ubuntu-latest ships no yosys. So
      # fpga::tests::test_smoke_gate_json_synthetic_verify_lean -- which calls
      # the real smoke_gate(), whose `passed` flag ANDs in `yosys_ok` -- hit
      # "[smoke-gate] SKIP: yosys not on PATH" and failed on every single run.
      # 11 runs on master, 11 failures, no green in this workflow's history:
      # the job could not pass by construction, and the job never even reached
      # the install because a failed step aborts the rest.
      #
      # The test is right to demand the binary. A smoke gate that "passes"
      # while skipping its only synthesis phase asserts nothing -- the same
      # absence-is-not-a-value defect closed in #2285 and #2287. Fix the
      # ordering, not the assertion.
      - name: install yosys
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys

      # --nocapture --test-threads=1, and the log tee'd out, so the ratchet
      # below can measure something `cargo test` otherwise throws away.
      #
      # Three smoke-gate tests need a Lean toolchain that no workflow installs
      # (#2370). They do not use #[ignore] -- they println! a reason and return.
      # So libtest counts them as PASSED and the summary line reads
      # "0 ignored", and `cargo test` CAPTURES the stdout of a passing test, so
      # the reason never reaches the log at all. Without --nocapture there is
      # nothing to measure. Without --test-threads=1 the reason cannot be
      # attributed to a test, because libtest lands it on the "test NAME ... "
      # line it has already opened and parallel workers interleave those.
      #
      # set -o pipefail keeps tee from swallowing a real test failure.
      - name: cargo test -p tri
        run: |
          set -o pipefail
          cargo test -p tri -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/tri-test.log"

      # A green run of this job is consistent with those three never having
      # executed. This step puts the count and the reasons in the job summary so
      # a reader of a green run cannot mistake it for coverage, and ratchets the
      # set: it FAILS if the set grows. A fourth test starting to skip silently
      # is the regression nobody would otherwise see.
      #
      # It deliberately does not fail on today's three. Turning existing skips
      # red is the owner's policy decision and a skip is not a failure; #2370
      # stays open for the real fix, which is installing the toolchain.
      #
      # The baseline is emitted by this same script (--emit-baseline) from a real
      # test log. It is never hand-written: a hand-typed "3" would restate what
      # we already know and would not survive a rename.
      - name: runtime skip ratchet
        if: always()
        run: python3 cli/tri/skipwatch.py "$RUNNER_TEMP/tri-test.log" cli/tri/skip-baseline.txt

      # `tri rtl check` reports numbers, and a binary that runs but reports
      # nothing would pass the two steps above. yosys is already on PATH from
      # the install step above, so the command is exercised against a real
      # design rather than assumed.
      # `tri skill check` finds two sections sharing a number, prints PROBLEMS
      # and exits 1 -- and until now NOTHING called it. `grep -rn "skill check"`
      # across .github/workflows/, scripts/ and tools/ returned zero.
      #
      # It was not hypothetical: two sections were both numbered 504 on master,
      # landed 26 minutes apart by two sessions, each appending above the highest
      # number it had read. The checker would have caught it on the second PR.
      #
      # This job already builds the binary, so the marginal cost is one command.
      # Its `paths:` grows to .claude/skills/** in the same commit, because a
      # gate whose trigger is narrower than its subject cannot fire on the change
      # it exists for.
      - name: No two skill sections share a number
        run: ./target/debug/tri skill check

      # A census that moves silently is a number nobody re-read. Measured over
      # the 39 most recent transitions on master with one fixed instrument:
      # 8 commits moved a census and only 4 said so -- and one of the silent
      # four had made 45 of 50 red workflows in a sibling repository invisible
      # (#3176). The A/B that finds it is two commands, and nothing ran them.
      #
      # This is cheap for a reason that is structural rather than hopeful: each
      # pinned census's POPULATION IS A DIRECTORY, so it cannot move unless a
      # file in that directory changes. All 8 of the 8 observed moves had edited
      # that census's own subject; not one was a side effect. So the re-bless
      # falls only on commits already working in that area.
      #
      # Deliberately excluded: `dead` and `unmeasured` read the GitHub API, so
      # their answer moves when the world moves and pinning them would redden
      # this gate on somebody else's push. A test refuses their addition.
      - name: No census moved without saying so
        run: ./target/debug/tri census pin --gate

      - name: the CLI actually produces a report
        run: |
          set -uo pipefail
          ./target/debug/tri rtl check chips/phi --json > /tmp/r.json 2>/tmp/r.err || true
          cat /tmp/r.err | head -5
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/r.json'))['checks']))" 2>/dev/null || echo 0)
          echo "verdict lines: $N"
          if [ "${N:-0}" -lt 5 ]; then
            echo "::error::tri rtl check emitted $N verdicts; five checks should each emit one"
            exit 1
          fi
