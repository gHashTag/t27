# A loop tool that exists only in one working directory is not in the project.
#
# scripts/tri_loop/cost.py and diffbin.py were written, used to produce numbers
# that were quoted in a pull request, and lost -- never committed, and the working
# copy was later re-cloned. Every figure they had produced became unreproducible
# at once. Six recovery routes came back empty (#2158).
#
# Nothing in CI could tell the difference between a tool that exists and a tool
# that exists nowhere but one untracked directory. This gate is that difference.
# It is deliberately cheap: no build, no compiler, no corpus run, so there is no
# reason for it to be skipped or made optional.
name: loop-tools-gate

on:
  pull_request:
    paths:
      - "scripts/tri"
      - "scripts/tri_loop/**"
      - "scripts/ci/loop-tools-tracked.sh"
      - "scripts/ci/test_damage_repair_snapshot_required.py"
      - "scripts/ci/test_stranded_work_is_found_without_writing.py"
      - "scripts/ci/test_a_tick_resumes_from_what_it_reads.py"
      - "scripts/ci/test_an_open_pr_is_not_a_green_one.py"
      - "scripts/ci/test_a_t27b_tick_reads_before_it_acts.py"
      - "scripts/ci/test_a_t27b_spec_cannot_move_silently.py"
      - "scripts/ci/test_the_t27b_steward_decides_in_t27.py"
      - "scripts/ci/test_the_t27b_gen_check_asks_the_lab.py"
      - "scripts/ci/test_the_t27b_fuzz_judges_in_t27.py"
      - "tests/fixtures/t27b-fuzz/**"
      - "specs/tri/t27b/**"
      - "gen/c/tri/t27b/**"
      - "docs/reports/t27b_expectations.json"
      - "contrib/railway/t27b-lab/lab.py"
      - "scripts/ci/test_the_t27b_lab_heals_its_clone.py"
      - "scripts/ci/test_a_page_is_measured_at_both_widths.py"
      - "scripts/ci/test_the_queen_ranks_by_priority_t27.py"
      - "specs/queen/priority.t27"
      - "gen/c/queen/priority.c"
      - "scripts/ci/test_the_catalog_health_is_decided_in_t27.py"
      - "specs/tri/catalog/**"
      - "gen/c/tri/catalog/**"
      - ".github/workflows/loop-tools-gate.yml"
  push:
    branches: [master]
    paths:
      - "scripts/tri"
      - "scripts/tri_loop/**"
      - "scripts/ci/loop-tools-tracked.sh"
      - "scripts/ci/test_damage_repair_snapshot_required.py"
      - "scripts/ci/test_stranded_work_is_found_without_writing.py"
      - "scripts/ci/test_a_tick_resumes_from_what_it_reads.py"
      - "scripts/ci/test_an_open_pr_is_not_a_green_one.py"
      - "scripts/ci/test_a_t27b_tick_reads_before_it_acts.py"
      - "scripts/ci/test_a_t27b_spec_cannot_move_silently.py"
      - "scripts/ci/test_the_t27b_steward_decides_in_t27.py"
      - "scripts/ci/test_the_t27b_gen_check_asks_the_lab.py"
      - "scripts/ci/test_the_t27b_fuzz_judges_in_t27.py"
      - "tests/fixtures/t27b-fuzz/**"
      - "specs/tri/t27b/**"
      - "gen/c/tri/t27b/**"
      - "docs/reports/t27b_expectations.json"
      - "contrib/railway/t27b-lab/lab.py"
      - "scripts/ci/test_the_t27b_lab_heals_its_clone.py"
      - "scripts/ci/test_a_page_is_measured_at_both_widths.py"
      - "scripts/ci/test_the_queen_ranks_by_priority_t27.py"
      - "specs/queen/priority.t27"
      - "gen/c/queen/priority.c"
      - "scripts/ci/test_the_catalog_health_is_decided_in_t27.py"
      - "specs/tri/catalog/**"
      - "gen/c/tri/catalog/**"
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop-tools-tracked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check reads git index state, so it needs real history rather than
          # a detached blob export.
          fetch-depth: 1

      - name: Every loop tool is present, tracked, and routed
        run: bash scripts/ci/loop-tools-tracked.sh

      - name: Each loop helper is syntactically loadable
        # A tracked tool that cannot be imported is tracked and useless. This is
        # a syntax check only and asserts nothing about behaviour.
        run: |
          for f in scripts/tri_loop/*.py; do
            python3 -c "import py_compile,sys; py_compile.compile('$f', doraise=True)" \
              && echo "ok       $f" \
              || { echo "BROKEN   $f"; exit 1; }
          done

      - name: damage-repair requires --snapshot rather than defaulting to one
        # A reader that defaults to a snapshot path is guessing which freeze the
        # caller meant, and the path it guessed pointed at a file no default
        # workflow produced (#2327). Pure Python, no compiler, no corpus.
        run: python3 scripts/ci/test_damage_repair_snapshot_required.py

      - name: An empty match is not a number
        # #3067. `tri wave` printed "lesson last  -> next 1" against a 242 KB
        # document whose own last wave loop is 898, because the matcher found
        # nothing and empty-plus-exit-0 is not a failure. Runs here: no compiler
        # is needed, and the test builds its own two-document fixture.
        run: python3 scripts/ci/test_an_empty_match_is_not_a_number.py

      - name: A withdrawn section is not yours to carry
        # A section the base REMOVED reads as present-here-absent-there, exactly
        # like one you wrote, and a by-title rebuild puts the retraction back.
        # The merge base cannot tell them apart once you have merged, and
        # ancestry cannot because this repository squash-merges. `git log -S`
        # can -- and that is the half no unit test reaches, so this builds a
        # real repository: main adds a section, the branch takes it and appends
        # its own, main withdraws it. Carries its own negative control.
        run: python3 scripts/ci/test_a_withdrawn_section_is_not_yours.py

      - name: A --limit sample is not the corpus
        # diffbin truncated its file list with `files = files[:limit]` and then
        # took its denominator from the truncated list. Measured against the real
        # tree: `--limit 10` over `specs` printed "corpus: 10 specs under specs"
        # while 650 .t27 files were present, and a 2% sample could print 100%
        # coverage -- directly under a paragraph reading "Coverage below 100%
        # bounds what the run can claim". No compiler is needed here: the fake
        # binary never produces a verdict, and the subject is the denominator.
        run: python3 scripts/ci/test_a_sample_is_not_the_corpus.py

      - name: An absent compiler is "could not run", not "the check failed"
        # #3045. This job has no compiler, which is what makes it the right
        # place: the assertion is about the no-build path and nowhere else can
        # exercise it honestly. The test builds its own compiler-less tree
        # rather than relying on this job staying that way.
        run: python3 scripts/ci/test_tri_says_it_could_not_run.py

      - name: Pushed work with no pull request is found, and nothing is written
        # 2026-10-04: trinity feat/queen-browser-embedded sat four days pushed,
        # merging clean, with no PR, and nothing reported it. The test builds a
        # bare origin and a clone holding one branch of each kind tri stranded
        # must tell apart (old, conflicting, young, open-PR, cherry-picked,
        # squash-merged, dependabot, merged), checks that no PR state means
        # "undecided", exit 2 -- never "stranded" -- and that merge-tree wrote
        # no object into the clone. Carries its own negative control.
        run: python3 scripts/ci/test_stranded_work_is_found_without_writing.py

      - name: A cron tick's resume card names each anomaly and writes nothing
        # tri tick joins claim age with a dirty tree -- the sign the previous
        # tick died mid-work -- and the healthy fixture (old claim, clean tree)
        # is the control that age alone is not an anomaly. It also checks the
        # index is not refreshed, against a plain `git status` that does.
        run: python3 scripts/ci/test_a_tick_resumes_from_what_it_reads.py

      - name: An open pull request is reported with its verdict, not as "open"
        # 2026-10-04: a loop reported t27#5787 as "open" for six ticks while a
        # check on it was red. tri pr-state asks tri pr ready about every PR a
        # loop state names. The test answers from recorded fixtures (no network),
        # and its WAIT case is the slip itself: an open PR with nothing wrong in
        # the state and a check still running exits 1, not 0. A short recorded
        # head that prefixes the live one is the control that head-moved is not
        # raised by length alone.
        run: python3 scripts/ci/test_an_open_pr_is_not_a_green_one.py

      - name: The t27b steward reads its state before it acts
        # #6112. On 2026-10-04 the t27b loop read seven sources by hand and slipped
        # four times: a live subagent's mid-merge worktree taken for debris, a
        # stale railway CLI first on PATH, a branch's lab numbers quoted as
        # master's, a local reference run duplicating the lab. tri t27b doctor
        # names each. Fixtures for every source; the worktrees are real git
        # repositories. The healthy fixture is the negative control.
        run: python3 scripts/ci/test_a_t27b_tick_reads_before_it_acts.py

      - name: The t27b lab heals a clone that cannot check out
        # #6219. A redeploy killed a lab run mid-way and the next checkout
        # failed on the partial clone ("could not fetch ... from promisor
        # remote"); lab.checkout() had no second try. It now clones again,
        # once, and the run records clone "recloned". Local file:// repos only.
        run: python3 scripts/ci/test_the_t27b_lab_heals_its_clone.py

      - name: No t27b spec moves without being named
        # #6115. A total ("t27b N / reference M") hides a regression that lands
        # beside an improvement. tri t27b ratchet diffs a lab run against
        # docs/reports/t27b_expectations.json per spec: UNEXPECTED FAILURE and
        # UNEXPECTED PASS are red, a pass that ran no runtime assert is
        # pass_vacuous. A run identical to the ledger is the negative control;
        # a copy of the checker without its UNEXPECTED PASS branch is the
        # mutation control. The lab half imports the real lab.py.
        run: python3 scripts/ci/test_a_t27b_spec_cannot_move_silently.py

      - name: The t27b steward decides in t27
        # #6198. Owner's rule 2026-10-05 (AGENTS.md "t27b is written in t27"):
        # tri t27b delta classified transitions with a hand-written Python if
        # chain. That logic is now specs/tri/t27b/steward.t27, reaching Python
        # only as gen/c/tri/t27b/steward.c (t27c gen-c). The system cc builds
        # the spec's own tests from that C; a mutant that rounds down is the
        # mutation control. No t27c here, so the byte-for-byte gen-c compare
        # prints "not checked".
        run: python3 scripts/ci/test_the_t27b_steward_decides_in_t27.py

      - name: tri t27b gen-check asks the t27c lab and never guesses
        # #6231. gen/c/tri/t27b/steward.c is t27c gen-c output (L2); t27c runs on
        # the Railway lab t27c-lab, never on the Mac, and the byte-identity proof
        # was a hand-run railway ssh per PR. tri t27b gen-check ships the spec to
        # the lab and compares digests: SAME 0, DIFFERS 1, UNREACHABLE 2. A fake
        # lab stands in here (no network); a same-length one-byte change must be
        # DIFFERS, and a copy that compares lengths only is the mutation control.
        run: python3 scripts/ci/test_the_t27b_gen_check_asks_the_lab.py

      - name: tri t27b fuzz generates and judges in t27
        # #6442. The differential fuzzer's generator is specs/tri/t27b/fuzz.t27 and its
        # judge fuzz_oracle.t27; Python reaches them only through gen/c/tri/t27b/fuzz.c
        # and fuzz_oracle.c. The system cc runs both specs' tests from that C, every
        # fixture under tests/fixtures/t27b-fuzz/ must still render from its seed, and
        # a wrong checksum (both sides fail) must be a disagreement; an oracle that
        # calls it AGREE is the mutation control. No t27c, no t27b, no network.
        run: python3 scripts/ci/test_the_t27b_fuzz_judges_in_t27.py

      - name: The Queen's priority is decided in t27
        # #6366. tri priority ranks open issues only through gen/c/queen/priority.c
        # (t27c gen-c of specs/queen/priority.t27). The system cc builds the
        # spec's own tests; fixtures cover every rule, including the stokowski
        # bug (no priority sorted ahead of urgent); a reversed outranks is the
        # mutation control. No network, no t27c.
        run: python3 scripts/ci/test_the_queen_ranks_by_priority_t27.py

      - name: The catalog's health is split in t27
        # #6436. tri catalog health splits the SPECS catalog's warn and fail into
        # negative fixtures and real work, parse-fail and backend-only, only
        # through gen/c/tri/catalog/health.c (t27c gen-c of
        # specs/tri/catalog/health.t27). The system cc builds the spec's tests;
        # a swapped bucket or a break called a fix is the mutation control.
        run: python3 scripts/ci/test_the_catalog_health_is_decided_in_t27.py

      - name: The dispatcher runs its helpers without a built compiler
        # tri triage and tri damage read the tracker and the spec text and have no
        # use for t27c. The dispatcher used to look for the binary first and
        # refuse to run them on a machine with no build, so this step exists to
        # keep that ordering from coming back. There is no compiler in this job,
        # which is the whole point.
        run: |
          ./scripts/tri loop-help
          ./scripts/tri damage specs >/dev/null || true
          echo "ok       helpers dispatch with no t27c present"

  harness:
    # `tri harness` (#5827) measures a page at 375px and 1024px in a real
    # browser. It is its own job so the job above stays what its header promises:
    # no install, nothing to skip. This one installs the `playwright` package only
    # -- no browser download -- and drives the runner's own Google Chrome. If that
    # Chrome is ever missing the test FAILS: a harness that skips when it cannot
    # measure is the clean-by-absence result it exists to refuse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A page is measured at both widths, in every visible frame
        run: |
          python -m pip install --quiet playwright==1.58.0
          python scripts/ci/test_a_page_is_measured_at_both_widths.py
