# Proves properties of the generated BitNet RTL with Yosys, and checks that
# there is something left to prove.
#
# a_event_never_lost in formal/interrupt_controller_props.sv is a regression
# witness for a real lost-interrupt race: before 2026-08-09 a status_read
# concurrent with an interrupt event provably destroyed that event.
#
# Background (docs/FORMAL_FOUNDATIONS.md Props 2, 5, 6): Yosys's Verilog
# frontend accepts neither `property ... endproperty` nor inline
# `assert property (@(posedge clk) ...)`, so the `--with-sva` output has never
# been checkable by the open-source flow. sv2v is not a fix -- it drops
# assertions silently and exits 0, which would give a green formal run over an
# empty property set. `t27c gen-behavior-sva-yosys` emits the immediate-
# assertion subset Yosys does accept.
#
# The vacuity check below is the load-bearing step. A formal job that only runs
# a prover cannot distinguish "all properties hold" from "there are no
# properties", and this repository has already shipped three CI jobs that were
# a bare `echo`. Counting $check cells makes the difference observable.
#
# Anchor: phi^2 + 1/phi^2 = 3
name: Formal (Yosys)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: formal-yosys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: immediate-assertion subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-formal-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Build t27c
        run: cargo build --release --manifest-path bootstrap/Cargo.toml

      # Verify the verifier before trusting any result below. Yosys's `sat`
      # ignores $assume cells unless -set-assumes is passed, silently: a
      # harness still runs and still reports PROVED/REFUTED with every
      # assumption inert. This module assumes something unsatisfiable and
      # asserts something false, so it PROVES only when assumptions are live.
      # If this step ever fails, every "given a compliant environment" result
      # in this job is meaningless.
      - name: Assumptions are active in the proof flow
        run: |
          yosys -p "read_verilog -sv -formal formal/assume_liveness_check.sv; \
                    prep -top assume_liveness_check; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 4 -set-init-zero -set-assumes"

      - name: Emit the BitNet RTL bundle
        run: |
          set -euo pipefail
          mkdir -p build/rtl
          ./target/release/t27c gen-bitnet-bundle --output-dir build/rtl

      # Vacuity gate. A formal job that only runs a prover cannot distinguish
      # "all properties hold" from "there are no properties", and this repo has
      # already shipped three CI jobs that were a bare `echo`. Counting $check
      # cells makes the difference observable. sv2v output would score 0 here.
      - name: Assert the property set is non-empty
        run: |
          set -euo pipefail
          n=$(yosys -p "read_verilog -sv -formal build/rtl/interrupt_controller.sv \
                        formal/interrupt_controller_props.sv; \
                        prep -top irq_props -flatten; stat" \
                | grep -oE '[0-9]+ +\$check' | awk '{print $1}' | tail -1)
          echo "check cells: ${n:-0}"
          if [ "${n:-0}" -lt 6 ]; then
            echo "::error::Expected >=6 \$check cells, found ${n:-0} — the run would be vacuous or properties were dropped."
            exit 1
          fi

      # -flatten is required: `sat` refuses to run with more than one module
      # selected, and the resulting error reads exactly like a refutation.
      - name: Prove interrupt_controller properties
        run: |
          yosys -p "read_verilog -sv -formal build/rtl/interrupt_controller.sv \
                    formal/interrupt_controller_props.sv; \
                    prep -top irq_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 6 -tempinduct -set-assumes"

      - name: Prove axi_lite_slave properties
        run: |
          set -euo pipefail
          n=$(yosys -p "read_verilog -sv -formal build/rtl/axi_lite_slave.sv \
                        formal/axi_lite_slave_props.sv; \
                        prep -top axi_props -flatten; stat" \
                | grep -oE '[0-9]+ +\$check' | awk '{print $1}' | tail -1)
          echo "axi check cells: ${n:-0}"
          if [ "${n:-0}" -lt 7 ]; then
            echo "::error::Expected >=7 \$check cells for axi_props, found ${n:-0}."
            exit 1
          fi
          # -set-init-zero, not -tempinduct: induction from an unconstrained
          # initial state refutes properties that hold on every reachable
          # state (bresp == 2'b00 is one). That was an artifact; starting from
          # a reachable state is what separated it from the real defects.
          yosys -p "read_verilog -sv -formal build/rtl/axi_lite_slave.sv \
                    formal/axi_lite_slave_props.sv; \
                    prep -top axi_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 10 -set-init-zero -set-assumes"

      - name: Prove dma_controller properties
        run: |
          set -euo pipefail
          n=$(yosys -p "read_verilog -sv -formal build/rtl/dma_controller.sv \
                        formal/dma_controller_props.sv; \
                        prep -top dma_props -flatten; stat" \
                | grep -oE '[0-9]+ +\$check' | awk '{print $1}' | tail -1)
          echo "dma check cells: ${n:-0}"
          if [ "${n:-0}" -lt 8 ]; then
            echo "::error::Expected >=8 \$check cells for dma_props, found ${n:-0}."
            exit 1
          fi
          yosys -p "read_verilog -sv -formal build/rtl/dma_controller.sv \
                    formal/dma_controller_props.sv; \
                    prep -top dma_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 12 -set-init-zero -set-assumes"

      - name: Prove layer_sequencer properties
        run: |
          yosys -p "read_verilog -sv -formal build/rtl/layer_sequencer.sv \
                    formal/layer_sequencer_props.sv; \
                    prep -top ls_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 12 -set-init-zero -set-assumes"

      - name: Prove weight_prefetch_ctrl properties
        run: |
          yosys -p "read_verilog -sv -formal build/rtl/weight_prefetch_ctrl.sv \
                    formal/weight_prefetch_props.sv; \
                    prep -top wp_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 14 -set-init-zero -set-assumes"

      - name: Prove activation_requant properties
        run: |
          yosys -p "read_verilog -sv -formal -DFORMAL build/rtl/activation_requant.sv; \
                    prep -top activation_requant; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 40 -set-init-zero -set-assumes"

      # First multi-module proof in this repo. Everything above is
      # module-scoped; these properties range across the sequencer, the BRAMs
      # and the MAC, which only became possible once the datapath was wired
      # (docs/BITNET_V2_POSITION.md). -DFORMAL enables the `ifdef FORMAL block
      # inside bitnet_engine_top; the properties live there because the
      # alignment they check is internal and `sat` needs one flattened module.
      # DEPTH is reduced because `sat` cannot model $mem_v2 and the properties
      # do not read memory contents.
      - name: Prove bitnet_engine_top integration properties
        run: |
          set -euo pipefail
          ./target/release/t27c gen-trit-stdlib > build/rtl/trit_stdlib.sv
          yosys -p "read_verilog -sv -formal -DFORMAL \
                      build/rtl/bitnet_engine_top.sv \
                      build/rtl/multilayer_sequencer.sv \
                      build/rtl/layer_sequencer.sv \
                      build/rtl/double_buffer_ctrl.sv \
                      build/rtl/weight_bram.sv \
                      build/rtl/pipeline_stage2_compute.sv \
                      build/rtl/trit_stdlib.sv; \
                    chparam -set DEPTH 4 weight_bram; \
                    prep -top bitnet_engine_top -flatten; memory_map; \
                    async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 40 -set-init-zero -set-assumes"

      # Liveness witnesses for the assembled engine. Four waves of interlock
      # work constrained the reachable state space; an over-tight guard would
      # make every safety property pass by making the engine do nothing. Each
      # probe below asserts that an activity is IMPOSSIBLE and must therefore
      # REFUTE -- a counterexample is the proof the engine still functions.
      # The final probe is the inverse: DMA and MAC concurrently active must be
      # genuinely unreachable, so it must PROVE.
      - name: Engine is still alive under its interlocks
        run: |
          set -euo pipefail
          fail=0
          top=build/rtl/bitnet_engine_top.sv
          rest="build/rtl/multilayer_sequencer.sv build/rtl/layer_sequencer.sv \
                build/rtl/double_buffer_ctrl.sv build/rtl/weight_bram.sv \
                build/rtl/pipeline_stage2_compute.sv build/rtl/activation_requant.sv \
                build/rtl/weight_prefetch_ctrl.sv build/rtl/interrupt_controller.sv \
                build/rtl/axi_lite_slave.sv build/rtl/dma_controller.sv \
                build/rtl/trit_stdlib.sv"
          probe() {
            expr="$1"; want="$2"; name="$3"
            python3 - "$top" "$expr" > build/probe.sv <<'PY'
          import sys
          src = open(sys.argv[1]).read()
          i = src.rindex("endmodule")
          probe = "    always @(posedge clk) if (rst_n) w: assert (%s);\n" % sys.argv[2]
          sys.stdout.write(src[:i] + probe + src[i:])
          PY
            if yosys -q -p "read_verilog -sv -formal build/probe.sv $rest; \
                            chparam -set DEPTH 4 weight_bram; \
                            prep -top bitnet_engine_top -flatten; memory_map; \
                            async2sync; chformal -lower; \
                            sat -verify -prove-asserts -seq 22 -set-init-zero -set-assumes" \
                 >/dev/null 2>&1; then got=proves; else got=refutes; fi
            if [ "$got" != "$want" ]; then
              echo "::error::$name expected to $want but $got"
              fail=1
            else
              echo "ok       $name ($got)"
            fi
          }
          probe '!dma_busy'                      refutes 'DMA can start'
          probe '!dma_local_we'                  refutes 'DMA can write local memory'
          probe '!pf_bram_we'                    refutes 'weight prefetch can write'
          probe '!mac_valid_q'                   refutes 'MAC can be active'
          probe '!neuron_out_valid'              refutes 'neuron output can fire'
          probe '!(dma_busy && mac_valid_q)'     proves  'DMA and MAC never concurrent'
          exit $fail

      # Vacuity gate, part two. The $check-cell count proves properties EXIST;
      # this proves they BITE. Each witness asserts the negation of a case its
      # property exists to cover, so a counterexample is the proof that the case
      # is reachable. A witness that starts PROVING means that case became
      # unreachable and the property guarding it is now free.
      - name: Properties are non-vacuous (witnesses must refute)
        run: |
          set -euo pipefail
          fail=0
          run_witness() {
            top="$1"; mod="$2"; seq="$3"
            out=$(yosys -p "read_verilog -sv -formal build/rtl/${mod}.sv formal/witnesses.sv; \
                            prep -top ${top} -flatten; async2sync; chformal -lower; \
                            sat -verify -prove-asserts -seq ${seq} -set-init-zero -set-assumes" 2>&1 || true)
            if echo "$out" | grep -q "proof did fail"; then
              echo "ok       ${top} (case reachable)"
            else
              echo "::error::${top} did not refute -- the case it witnesses is unreachable, so the property it guards is vacuous."
              fail=1
            fi
          }
          run_witness w_irq_mask_case        interrupt_controller  6
          run_witness w_irq_concurrent_read  interrupt_controller  6
          run_witness w_axi_outstanding_one  axi_lite_slave       10
          run_witness w_axi_resp_pending     axi_lite_slave       10
          run_witness w_dma_multibeat_burst  dma_controller       12
          run_witness w_dma_burst_active     dma_controller       12
          run_witness w_ls_multi_neuron      layer_sequencer      12
          run_witness w_wp_writes_happen     weight_prefetch_ctrl 14
          exit $fail

      - name: Behavior-DSL subset still emits and parses
        run: |
          set -euo pipefail
          cat > behaviors.json <<'JSON'
          [
            {"name":"engine_busy_safety","given":"running","when":"posedge clk","then":"set full"},
            {"name":"irq_clear_on_reset","given":"reset inactive","when":"posedge clk","then":"after 1 cycles set full"}
          ]
          JSON
          ./target/release/t27c gen-behavior-sva-yosys behaviors.json --output formal_dsl.sv
          yosys -p "read_verilog -sv -formal formal_dsl.sv; prep -top behavior_yosys"
