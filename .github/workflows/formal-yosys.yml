# Proves properties of the generated BitNet RTL with Yosys, and checks that
# there is something left to prove.
#
# a_event_never_lost in formal/interrupt_controller_props.sv is a regression
# witness for a real lost-interrupt race: before 2026-08-09 a status_read
# concurrent with an interrupt event provably destroyed that event.
#
# Background (docs/FORMAL_FOUNDATIONS.md Props 2, 5, 6): Yosys's Verilog
# frontend accepts neither `property ... endproperty` nor inline
# `assert property (@(posedge clk) ...)`, so the `--with-sva` output has never
# been checkable by the open-source flow. sv2v is not a fix -- it drops
# assertions silently and exits 0, which would give a green formal run over an
# empty property set. `t27c gen-behavior-sva-yosys` emits the immediate-
# assertion subset Yosys does accept.
#
# The vacuity check below is the load-bearing step. A formal job that only runs
# a prover cannot distinguish "all properties hold" from "there are no
# properties", and this repository has already shipped three CI jobs that were
# a bare `echo`. Counting $check cells makes the difference observable.
#
# Anchor: phi^2 + 1/phi^2 = 3
name: Formal (Yosys)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: formal-yosys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: immediate-assertion subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-formal-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Build t27c
        run: cargo build --release --manifest-path bootstrap/Cargo.toml

      # Verify the verifier before trusting any result below. Yosys's `sat`
      # ignores $assume cells unless -set-assumes is passed, silently: a
      # harness still runs and still reports PROVED/REFUTED with every
      # assumption inert. This module assumes something unsatisfiable and
      # asserts something false, so it PROVES only when assumptions are live.
      # If this step ever fails, every "given a compliant environment" result
      # in this job is meaningless.
      - name: Assumptions are active in the proof flow
        run: |
          yosys -p "read_verilog -sv -formal formal/assume_liveness_check.sv; \
                    prep -top assume_liveness_check; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 4 -set-init-zero -set-assumes"

      - name: Emit the BitNet RTL bundle
        run: |
          set -euo pipefail
          mkdir -p build/rtl
          ./target/release/t27c gen-bitnet-bundle --output-dir build/rtl

      # Vacuity gate. A formal job that only runs a prover cannot distinguish
      # "all properties hold" from "there are no properties", and this repo has
      # already shipped three CI jobs that were a bare `echo`. Counting $check
      # cells makes the difference observable. sv2v output would score 0 here.
      - name: Assert the property set is non-empty
        run: |
          set -euo pipefail
          n=$(yosys -p "read_verilog -sv -formal build/rtl/interrupt_controller.sv \
                        formal/interrupt_controller_props.sv; \
                        prep -top irq_props -flatten; stat" \
                | grep -oE '[0-9]+ +\$check' | awk '{print $1}' | tail -1)
          echo "check cells: ${n:-0}"
          if [ "${n:-0}" -lt 6 ]; then
            echo "::error::Expected >=6 \$check cells, found ${n:-0} — the run would be vacuous or properties were dropped."
            exit 1
          fi

      # -flatten is required: `sat` refuses to run with more than one module
      # selected, and the resulting error reads exactly like a refutation.
      - name: Prove interrupt_controller properties
        run: |
          yosys -p "read_verilog -sv -formal build/rtl/interrupt_controller.sv \
                    formal/interrupt_controller_props.sv; \
                    prep -top irq_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 6 -tempinduct -set-assumes"

      - name: Prove axi_lite_slave properties
        run: |
          set -euo pipefail
          n=$(yosys -p "read_verilog -sv -formal build/rtl/axi_lite_slave.sv \
                        formal/axi_lite_slave_props.sv; \
                        prep -top axi_props -flatten; stat" \
                | grep -oE '[0-9]+ +\$check' | awk '{print $1}' | tail -1)
          echo "axi check cells: ${n:-0}"
          # 7 -> 6 in Wave 591: a_sanity was `X == X`, folded to constant true,
          # and it still emitted a $check cell. This gate exists to catch an
          # all-vacuous property set, and a syntactically-true property was
          # inflating exactly the number meant to detect that. See Prop. 41.
          if [ "${n:-0}" -lt 6 ]; then
            echo "::error::Expected >=6 \$check cells for axi_props, found ${n:-0}."
            exit 1
          fi
          # -set-init-zero, not -tempinduct: induction from an unconstrained
          # initial state refutes properties that hold on every reachable
          # state (bresp == 2'b00 is one). That was an artifact; starting from
          # a reachable state is what separated it from the real defects.
          yosys -p "read_verilog -sv -formal build/rtl/axi_lite_slave.sv \
                    formal/axi_lite_slave_props.sv; \
                    prep -top axi_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 10 -set-init-zero -set-assumes"

      - name: Prove dma_controller properties
        run: |
          set -euo pipefail
          n=$(yosys -p "read_verilog -sv -formal build/rtl/dma_controller.sv \
                        formal/dma_controller_props.sv; \
                        prep -top dma_props -flatten; stat" \
                | grep -oE '[0-9]+ +\$check' | awk '{print $1}' | tail -1)
          echo "dma check cells: ${n:-0}"
          # 8 -> 7 in Wave 591, same reason as axi_props above (Prop. 41).
          if [ "${n:-0}" -lt 7 ]; then
            echo "::error::Expected >=7 \$check cells for dma_props, found ${n:-0}."
            exit 1
          fi
          yosys -p "read_verilog -sv -formal build/rtl/dma_controller.sv \
                    formal/dma_controller_props.sv; \
                    prep -top dma_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 80 -set-init-zero -set-assumes"

      - name: Prove layer_sequencer properties
        run: |
          yosys -p "read_verilog -sv -formal build/rtl/layer_sequencer.sv \
                    formal/layer_sequencer_props.sv; \
                    prep -top ls_props -flatten; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 48 -set-init-zero -set-assumes"

      # Proved one property per invocation, not as a batch. `-prove-asserts`
      # solves every assertion in a single SAT instance, and that instance is
      # superlinearly harder than its parts: at -seq 40 this module is undecided
      # in 240 s as a batch while its most expensive property alone proves in
      # 89 s and the other two in under a second (Prop. 35). Splitting raised
      # the bound this module is verified at from 14 to 40 for the same wall
      # time -- and it also attributes a failure to one property instead of
      # leaving "something in here broke".
      - name: Prove weight_prefetch_ctrl properties
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, sys
          src = open("formal/weight_prefetch_props.sv").read()
          labels = re.findall(r"(a_[a-z_]+): assert", src)
          fail = []
          for keep in labels:
              s = src
              for other in labels:
                  if other != keep:
                      s = re.sub(re.escape(other) + r": assert \([^;]*\);",
                                 other + ": assert (1'b1);", s)
              open("build/wp_one.sv", "w").write(s)
              r = subprocess.run(["yosys", "-q", "-p",
                  "read_verilog -sv -formal build/rtl/weight_prefetch_ctrl.sv build/wp_one.sv; "
                  "prep -top wp_props -flatten; async2sync; chformal -lower; "
                  "sat -verify -prove-asserts -seq 40 -set-init-zero -set-assumes"],
                  capture_output=True, text=True)
              if r.returncode != 0:
                  fail.append(keep)
                  print(f"::error::{keep} not proved at -seq 40")
              else:
                  print(f"ok       {keep}")
          sys.exit(1 if fail else 0)
          PY

      - name: Prove activation_requant properties
        run: |
          yosys -p "read_verilog -sv -formal -DT27_FORMAL build/rtl/activation_requant.sv; \
                    prep -top activation_requant; async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 40 -set-init-zero -set-assumes"

      # First multi-module proof in this repo. Everything above is
      # module-scoped; these properties range across the sequencer, the BRAMs
      # and the MAC, which only became possible once the datapath was wired
      # (docs/BITNET_V2_POSITION.md). -DT27_FORMAL enables the `ifdef FORMAL block
      # inside bitnet_engine_top; the properties live there because the
      # alignment they check is internal and `sat` needs one flattened module.
      # DEPTH is reduced because `sat` cannot model $mem_v2 and the properties
      # do not read memory contents.
      # Two sets since Wave 605. Four properties need ten formal-only tracking
      # registers and cost 75% of the proof time (Prop. 54): behind
      # T27_FORMAL_DEEP, the other 22 reach -seq 80 again, where all 26 are
      # undecided beyond 1200 s at -seq 60. Nothing is dropped -- both sets are
      # gated below, and the bound each property is checked at rises or holds.
      - name: Prove integration properties (core 22, deep bound)
        run: |
          yosys -p "read_verilog -sv -formal -DT27_FORMAL \
                      build/rtl/bitnet_engine_top.sv build/rtl/multilayer_sequencer.sv \
                      build/rtl/layer_sequencer.sv build/rtl/double_buffer_ctrl.sv \
                      build/rtl/weight_bram.sv build/rtl/pipeline_stage2_compute.sv \
                      build/rtl/activation_requant.sv build/rtl/weight_prefetch_ctrl.sv \
                      build/rtl/interrupt_controller.sv build/rtl/axi_lite_slave.sv \
                      build/rtl/dma_controller.sv build/rtl/trit_stdlib.sv; \
                    chparam -set DEPTH 4 weight_bram; \
                    prep -top bitnet_engine_top -flatten; memory_map; \
                    async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 80 -set-init-zero -set-assumes"

      - name: Prove integration properties (all 26, tracker-backed included)
        run: |
          yosys -p "read_verilog -sv -formal -DT27_FORMAL -DT27_FORMAL_DEEP \
                      build/rtl/bitnet_engine_top.sv build/rtl/multilayer_sequencer.sv \
                      build/rtl/layer_sequencer.sv build/rtl/double_buffer_ctrl.sv \
                      build/rtl/weight_bram.sv build/rtl/pipeline_stage2_compute.sv \
                      build/rtl/activation_requant.sv build/rtl/weight_prefetch_ctrl.sv \
                      build/rtl/interrupt_controller.sv build/rtl/axi_lite_slave.sv \
                      build/rtl/dma_controller.sv build/rtl/trit_stdlib.sv; \
                    chparam -set DEPTH 4 weight_bram; \
                    prep -top bitnet_engine_top -flatten; memory_map; \
                    async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 40 -set-init-zero -set-assumes"

      # Maximum-sized requests (Prop. 29). Counts are much wider than the
      # addresses they drive -- num_words is 16 bits over a 12-bit bram_addr,
      # length is 32 bits over a 12-bit local_addr -- so an oversized request
      # wrapped the address and overwrote data already transferred, then
      # reported success. Reaching 4096 writes is far outside any bounded check,
      # which is why every property missed it; the address is scaled to 3 bits
      # so the wrap lands inside the bound, exactly as `chparam DEPTH 4` scales
      # the memory elsewhere in this file.
      - name: Oversized requests do not wrap the local address
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, sys, os

          def scale(dut, sig, n, src=None, dest="build/scaled"):
              s = src if src else open(f"build/rtl/{dut}.sv").read()
              s = s.replace(f"[11:0] {sig}", f"[{n-1}:0] {sig}")
              s = s.replace("[11:0] word_index", f"[{n-1}:0] word_index")
              s = re.sub(r"\b12'd(\d+)", lambda m: f"{n}'d{m.group(1)}", s)
              s = s.replace("16'd4096", "16'd8").replace("32'd32768", "32'd64")
              os.makedirs(dest, exist_ok=True)
              open(f"{dest}/{dut}.sv", "w").write(s)

          def props(sig, n):
              # The wrapper's own wires must narrow with the DUT port. Left at 12
              # bits against a 3-bit port, the upper bits are undriven and every
              # comparison against them is x -- which reads exactly like a design
              # defect and cost most of Wave 581 to find.
              t = open("formal/max_size_props.sv").read()
              t = t.replace(f"wire [11:0] {sig};", f"wire [{n-1}:0] {sig};")
              t = t.replace("reg [11:0] fv_last;", f"reg [{n-1}:0] fv_last;")
              t = t.replace("reg [11:0] fv_next;", f"reg [{n-1}:0] fv_next;")
              t = re.sub(r"\b12'd(\d+)", lambda m: f"{n}'d{m.group(1)}", t)
              open("build/ms_props.sv", "w").write(t)

          def run(dut, wrap, d):
              return subprocess.run(["yosys", "-q", "-p",
                  f"read_verilog -sv -formal {d}/{dut}.sv build/ms_props.sv; "
                  f"prep -top {wrap} -flatten; async2sync; chformal -lower; "
                  "sat -verify -prove-asserts -seq 30 -set-init-zero -set-assumes"],
                  capture_output=True, text=True).returncode == 0

          CASES = [
              # Contiguity is the property that would have caught Prop. 29d
              # directly: monotonicity alone permits skipping slot 0, which is
              # exactly what the off-by-one did.
              ("weight_prefetch_ctrl", "ms_prefetch", "bram_addr", "proves",
               "words_remaining <= (num_words > 16'd4096) ? 16'd4096 : num_words;",
               "words_remaining <= num_words;"),
              # CLOSED in Wave 581 after three defects: the write/address
              # off-by-one (29d), local_addr serving two roles with a reset
              # inside the length!=0 branch (31c), and a write strobe held as a
              # level rather than pulsed per beat (32). Now expected to PROVE.
              ("dma_controller", "ms_dma", "local_addr", "proves",
               "bytes_remaining <= (length > 32'd32768) ? 32'd32768 : length;",
               "bytes_remaining <= length;"),
          ]

          fail = []
          for dut, wrap, sig, want, clamp, unclamp in CASES:
              scale(dut, sig, 3)
              props(sig, 3)
              got = "proves" if run(dut, wrap, "build/scaled") else "refutes"
              if got != want:
                  fail.append(f"{dut}: expected {want}, got {got}")
              else:
                  print(f"ok       {dut} ({got})")
              # the property must still be able to see the defect
              raw = open(f"build/rtl/{dut}.sv").read()
              if raw.count(clamp) != 1:
                  fail.append(f"{dut}: clamp text not found -- the check below is blind")
                  continue
              scale(dut, sig, 3, src=raw.replace(clamp, unclamp, 1), dest="build/noclamp")
              if run(dut, wrap, "build/noclamp"):
                  fail.append(f"{dut}: property proves with the clamp REMOVED -- it is not testing the wrap")
              else:
                  print(f"ok       {dut} property still detects an unclamped wrap")

          if fail:
              for f in fail:
                  print(f"::error::{f}")
              sys.exit(1)
          PY

      # The trace reader is validated before it is trusted. Two waves were spent
      # reasoning about a counterexample that had never actually been parsed:
      # an ad-hoc regex over `sat -show` dropped every row, and `-dump_json`
      # emits invalid JSON (RTLIL names contain backslashes, so `execute`
      # becomes the escape `\e`). This runs the reader against a property whose
      # counterexample is KNOWN -- the prefetch with its clamp removed, which
      # must show a write at a wrapped address -- and fails if the reader cannot
      # see it. Verify the instrument on a case whose answer you already know.
      - name: Trace reader reads a known counterexample
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys
          sys.path.insert(0, "formal")
          import trace_reader as tr

          raw = open("build/rtl/weight_prefetch_ctrl.sv").read()
          s = raw.replace("words_remaining <= (num_words > 16'd4096) ? 16'd4096 : num_words;",
                          "words_remaining <= num_words;", 1)
          s = s.replace("[11:0] bram_addr", "[2:0] bram_addr")
          s = s.replace("[11:0] word_index", "[2:0] word_index")
          s = re.sub(r"\b12'd(\d+)", lambda m: f"3'd{m.group(1)}", s)
          s = s.replace("16'd4096", "16'd8")
          os.makedirs("build/known", exist_ok=True)
          open("build/known/weight_prefetch_ctrl.sv", "w").write(s)

          props = open("formal/max_size_props.sv").read()
          for lab in re.findall(r"(a_[a-z_]+): assert", props):
              if lab != "a_bram_writes_contiguous":
                  props = re.sub(re.escape(lab) + r": assert \([^;]*\);",
                                 lab + ": assert (1'b1);", props)
          open("build/known_props.sv", "w").write(props)

          refuted, trace = tr.run_and_read(
              "read_verilog -sv -formal build/known/weight_prefetch_ctrl.sv build/known_props.sv; "
              "prep -top ms_prefetch -flatten; async2sync; chformal -lower; "
              "sat -verify -prove-asserts -seq 30 -set-init-zero -set-assumes "
              "-show-all -dump_json build/known.json", "build/known.json")

          def val(name, t):
              a = trace.get(name)
              if not a or t >= len(a) or not isinstance(a[t], str):
                  return None
              return int(a[t], 2) if set(a[t]) <= set("01") and a[t] else None

          fail = []
          if not refuted:
              fail.append("the known-counterexample property did not refute")
          if len(trace) < 20:
              fail.append(f"reader parsed only {len(trace)} signals")
          depth = max((len(v) for v in trace.values()), default=0)
          wrapped = [t for t in range(1, depth)
                     if val("bram_we", t) == 1 and val("bram_addr", t) is not None
                     and val("bram_addr", t - 1) is not None
                     and val("bram_addr", t) < val("bram_addr", t - 1)]
          if not wrapped:
              fail.append("reader saw no wrapping write in a trace that must contain one")

          if fail:
              for f in fail:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"ok       reader parsed {len(trace)} signals; wrap visible at t={wrapped[0]}")
          PY

      # No property may be discharged by syntax alone (Prop. 41 / 42).
      #
      # Vacuity checking in this file asks whether a property's GUARD is
      # reachable. It never asked whether the BODY survives the optimiser. Five
      # properties of the form `X == X` proved unconditionally for dozens of
      # waves, tested nothing, and still emitted $check cells -- padding the
      # count-based gates above that exist to detect an all-vacuous set.
      #
      # The scan is syntactic and says so: it makes the known-free shapes
      # unable to return, not "no free property can exist". It is itself
      # mutation-tested -- see the second half of this step.
      - name: No property is discharged by syntax alone
        run: |
          set -euo pipefail
          python3 formal/identity_scan.py

          # The gate must bite. Reintroduce each free shape and require a flag,
          # and require a real property NOT to be flagged (Prop. 28's control).
          mkdir -p build/gatetest
          python3 - <<'PY'
          import subprocess, sys
          base = open("formal/layer_sequencer_props.sv").read()
          CASES = [
              ("self-comparison",        "a_probe: assert (chunk_id == chunk_id);",        True),
              ("nested self-comparison", "a_probe: assert (valid && (chunk_id == chunk_id));", True),
              ("unsigned >= 0",          "a_probe: assert (chunk_id >= 0);",               True),
              ("literal true",           "a_probe: assert (1'b1);",                        True),
              ("a real property",        "a_probe: assert (valid || !done);",              False),
          ]
          fail = []
          for desc, inject, want_flag in CASES:
              s = base.replace("endmodule",
                               f"    always @(posedge clk) if (rst_n)\n        {inject}\nendmodule", 1)
              open("build/gatetest/probe_props.sv", "w").write(s)
              r = subprocess.run(["python3", "formal/identity_scan.py",
                                  "build/gatetest/probe_props.sv"],
                                 capture_output=True, text=True)
              flagged = r.returncode != 0
              if flagged != want_flag:
                  fail.append(f"{desc}: expected {'flagged' if want_flag else 'passed'}, got "
                              f"{'flagged' if flagged else 'passed'}")
              else:
                  print(f"ok       gate {'flags' if flagged else 'passes'} {desc}")
          if fail:
              for f in fail:
                  print(f"::error::identity_scan {f}")
              sys.exit(1)
          PY

      # Module-suite liveness (Prop. 51). The engine has had liveness witnesses
      # since Wave 577; the module suites never did. Wave 600 found an
      # assumption that silently removed behaviour from a whole file -- every
      # property still passed, and two engine-level witnesses caught it only by
      # luck of coverage. These probes close that gap: each asserts an activity
      # is IMPOSSIBLE and must REFUTE, so a proof means the suite's assumptions
      # removed it. Validated against Wave 600's exact over-constraint, which
      # they catch.
      - name: Module suites are still alive under their assumptions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, sys

          SUITES = [
              ("interrupt_controller", "formal/interrupt_controller_props.sv", "irq_props", 6,  "-tempinduct",    ["irq_out"]),
              ("axi_lite_slave",       "formal/axi_lite_slave_props.sv",       "axi_props", 10, "-set-init-zero", ["bvalid", "rvalid"]),
              ("dma_controller",       "formal/dma_controller_props.sv",       "dma_props", 20, "-set-init-zero", ["local_we", "done"]),
              ("layer_sequencer",      "formal/layer_sequencer_props.sv",      "ls_props",  20, "-set-init-zero", ["valid", "done"]),
              ("weight_prefetch_ctrl", "formal/weight_prefetch_props.sv",      "wp_props",  20, "-set-init-zero", ["bram_we", "prefetch_done"]),
          ]
          fail = []
          for dut, props, top, seq, mode, sigs in SUITES:
              src = open(props).read()
              i = src.rindex("endmodule")
              for sig in sigs:
                  open("build/live.sv", "w").write(
                      src[:i] + f"    always @(posedge clk) if (rst_n) w_live: assert (!({sig}));\n" + src[i:])
                  r = subprocess.run(["yosys", "-q", "-p",
                      f"read_verilog -sv -formal build/rtl/{dut}.sv build/live.sv; prep -top {top} -flatten; "
                      f"async2sync; chformal -lower; "
                      f"sat -verify -prove-asserts -seq {seq} {mode} -set-assumes"],
                      capture_output=True, text=True)
                  out = r.stdout + r.stderr
                  if "ERROR" in out and "proof did fail" not in out:
                      fail.append(f"{top}/{sig}: tool error, not a verdict")
                      print(f"::error::{top}/{sig} tool error")
                  elif r.returncode == 0:
                      fail.append(f"{top}/{sig} is UNREACHABLE -- an assumption removed it")
                      print(f"::error::{top}/{sig} unreachable under this suite's assumptions")
                  else:
                      print(f"ok       {top}/{sig} reachable")
          sys.exit(1 if fail else 0)
          PY

      # Baseline gate. Every probe below reads a nonzero yosys exit as "the probe
      # refuted", so a probe verdict is only meaningful if the UNPROBED design
      # proves first. This is not hypothetical: an interlock tried in wave 27
      # made yosys' own async2sync obligations fail, and every probe in the
      # liveness table silently flipped to "refutes" for a reason that had
      # nothing to do with any probe. Establish the baseline, then trust probes.
      - name: Baseline - unprobed design must prove
        run: |
          set -euo pipefail
          yosys -p "read_verilog -sv -formal \
                      build/rtl/bitnet_engine_top.sv build/rtl/multilayer_sequencer.sv \
                      build/rtl/layer_sequencer.sv build/rtl/double_buffer_ctrl.sv \
                      build/rtl/weight_bram.sv build/rtl/pipeline_stage2_compute.sv \
                      build/rtl/activation_requant.sv build/rtl/weight_prefetch_ctrl.sv \
                      build/rtl/interrupt_controller.sv build/rtl/axi_lite_slave.sv \
                      build/rtl/dma_controller.sv build/rtl/trit_stdlib.sv; \
                    chparam -set DEPTH 4 weight_bram; \
                    prep -top bitnet_engine_top -flatten; memory_map; \
                    async2sync; chformal -lower; \
                    sat -verify -prove-asserts -seq 22 -set-init-zero -set-assumes"

      # Prop. 39e stood open for eight waves, gated here as an expected
      # refutation so that closing it would turn the build red and demand
      # promotion. It closed in Wave 597 and both properties now live in the
      # default -DT27_FORMAL set, so this step asserts the absence of any
      # remaining expected-refutation guard: nothing in the engine is knowingly
      # broken. Re-add a guarded property here if a future defect must be
      # recorded rather than fixed.
      - name: No property is gated as an expected refutation
        run: |
          set -euo pipefail
          if grep -q "ifdef T27_FORMAL_OPEN" build/rtl/bitnet_engine_top.sv; then
            echo "::error::a property is gated as an expected refutation; document it in FORMAL_FOUNDATIONS.md"
            exit 1
          fi
          echo "ok       no expected-refutation guards remain"

      # Liveness witnesses for the assembled engine. These deliberately pass NO
      # property define, which only became meaningful in Wave 589: until the
      # guard was renamed to T27_FORMAL, `read_verilog -formal` predefined
      # FORMAL and every "probe-only" run compiled the whole property set
      # (Prop. 39b). Re-checked in Wave 590 against a genuinely property-free
      # build -- all six verdicts unchanged (Prop. 40b). Four waves of interlock
      # work constrained the reachable state space; an over-tight guard would
      # make every safety property pass by making the engine do nothing. Each
      # probe below asserts that an activity is IMPOSSIBLE and must therefore
      # REFUTE -- a counterexample is the proof the engine still functions.
      # The final probe is the inverse: DMA and MAC concurrently active must be
      # genuinely unreachable, so it must PROVE.
      - name: Engine is still alive under its interlocks
        run: |
          set -euo pipefail
          fail=0
          top=build/rtl/bitnet_engine_top.sv
          rest="build/rtl/multilayer_sequencer.sv build/rtl/layer_sequencer.sv \
                build/rtl/double_buffer_ctrl.sv build/rtl/weight_bram.sv \
                build/rtl/pipeline_stage2_compute.sv build/rtl/activation_requant.sv \
                build/rtl/weight_prefetch_ctrl.sv build/rtl/interrupt_controller.sv \
                build/rtl/axi_lite_slave.sv build/rtl/dma_controller.sv \
                build/rtl/trit_stdlib.sv"
          probe() {
            expr="$1"; want="$2"; name="$3"
            python3 - "$top" "$expr" > build/probe.sv <<'PY'
          import sys
          src = open(sys.argv[1]).read()
          i = src.rindex("endmodule")
          probe = "    always @(posedge clk) if (rst_n) w: assert (%s);\n" % sys.argv[2]
          sys.stdout.write(src[:i] + probe + src[i:])
          PY
            if yosys -q -p "read_verilog -sv -formal build/probe.sv $rest; \
                            chparam -set DEPTH 4 weight_bram; \
                            prep -top bitnet_engine_top -flatten; memory_map; \
                            async2sync; chformal -lower; \
                            sat -verify -prove-asserts -seq 22 -set-init-zero -set-assumes" \
                 >/dev/null 2>&1; then got=proves; else got=refutes; fi
            if [ "$got" != "$want" ]; then
              echo "::error::$name expected to $want but $got"
              fail=1
            else
              echo "ok       $name ($got)"
            fi
          }
          probe '!dma_busy'                      refutes 'DMA can start'
          probe '!dma_local_we'                  refutes 'DMA can write local memory'
          probe '!pf_bram_we'                    refutes 'weight prefetch can write'
          probe '!mac_valid_q'                   refutes 'MAC can be active'
          probe '!neuron_out_valid'              refutes 'neuron output can fire'
          probe '!(dma_busy && mac_valid_q)'     proves  'DMA and MAC never concurrent'
          exit $fail

      # Vacuity gate, part two. The $check-cell count proves properties EXIST;
      # this proves they BITE. Each witness asserts the negation of a case its
      # property exists to cover, so a counterexample is the proof that the case
      # is reachable. A witness that starts PROVING means that case became
      # unreachable and the property guarding it is now free.
      - name: Properties are non-vacuous (witnesses must refute)
        run: |
          set -euo pipefail
          fail=0
          run_witness() {
            top="$1"; mod="$2"; seq="$3"
            out=$(yosys -p "read_verilog -sv -formal build/rtl/${mod}.sv formal/witnesses.sv; \
                            prep -top ${top} -flatten; async2sync; chformal -lower; \
                            sat -verify -prove-asserts -seq ${seq} -set-init-zero -set-assumes" 2>&1 || true)
            if echo "$out" | grep -q "proof did fail"; then
              echo "ok       ${top} (case reachable)"
            else
              echo "::error::${top} did not refute -- the case it witnesses is unreachable, so the property it guards is vacuous."
              fail=1
            fi
          }
          run_witness w_irq_mask_case        interrupt_controller  6
          run_witness w_irq_concurrent_read  interrupt_controller  6
          run_witness w_axi_outstanding_one  axi_lite_slave       10
          run_witness w_axi_resp_pending     axi_lite_slave       10
          run_witness w_dma_multibeat_burst  dma_controller       12
          run_witness w_dma_burst_active     dma_controller       12
          run_witness w_ls_multi_neuron      layer_sequencer      12
          run_witness w_wp_writes_happen     weight_prefetch_ctrl 14
          exit $fail

      - name: Behavior-DSL subset still emits and parses
        run: |
          set -euo pipefail
          cat > behaviors.json <<'JSON'
          [
            {"name":"engine_busy_safety","given":"running","when":"posedge clk","then":"set full"},
            {"name":"irq_clear_on_reset","given":"reset inactive","when":"posedge clk","then":"after 1 cycles set full"}
          ]
          JSON
          ./target/release/t27c gen-behavior-sva-yosys behaviors.json --output formal_dsl.sv
          yosys -p "read_verilog -sv -formal formal_dsl.sv; prep -top behavior_yosys"
