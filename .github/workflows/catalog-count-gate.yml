name: Catalog Count Invariant (CI-01)

# Kills the count-drift bug class. Enforces SSOT == fresh regenerated codegen
# on every PR touching the numeric catalog or its codegen path. The canonical
# number is the count of `// CATALOG:` lines in the SSOT; codegen run fresh
# against it must reproduce that number exactly (catches the parser-bug class
# that silently dropped formula-bias rows). Paper-count divergence is surfaced
# as a WARN that requires an erratum, not a silent edit.
#
# T86: the parenthetical here used to read "arXiv:2606.09686 says 84; SSOT
# canonical is 83". Both numbers are stale -- the gate's paper constant is 83
# and the live SSOT is 109 -- so the WARN it describes now fires on EVERY run
# and has since the ladder grew past the paper. A warning that is always on
# carries no information; see the issue linked from check_catalog_count.py.
#
# NOTE: per the repo constitution (L2 GENERATION), gen/ is DERIVED and is never
# hand-committed in a PR. This gate therefore regenerates into a temp dir and
# checks that against the SSOT; it does NOT diff committed gen/.

on:
  pull_request:
    # No `branches:` filter on pull_request, deliberately. A branch filter makes
    # this gate silent on any PR whose base is not listed -- a stacked PR then
    # shows a green check list that a master-based PR would not get. Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below, where one
    # exists, is left alone: restricting post-merge runs is a cost decision.
    paths:
      - "specs/numeric/formats_catalog.t27"
      - "tools/gen_formats_catalog.py"
      - "tools/check_catalog_count.py"
      # T85, two reach defects. First: this job runs check_catalog_integrity.py
      # but did not list it, so a one-line edit to that gate landed in a PR that
      # never executed it -- the same defect the branch-filter note above guards
      # against, one file over.
      - "tools/check_catalog_integrity.py"
      # Second, and worse: that gate exists because a glob deleted
      # specs/numeric/gfternary.t27 while its catalog row survived. Only
      # formats_catalog.t27 was listed, so deleting a spec -- the exact incident
      # -- did not trigger the workflow written to catch it. The gate could not
      # fire on its own founding case.
      - "specs/numeric/*.t27"
      - ".github/workflows/catalog-count-gate.yml"
  workflow_dispatch:

jobs:
  count-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce SSOT == fresh regen (canonical count)
        run: |
          python3 tools/check_catalog_count.py

      # T68: this gate existed and ran nowhere. A whole-tree grep for
      # check_catalog_integrity.py found it in docs/NOW.md and nothing else --
      # no workflow, no hook, no Makefile target. It is the ONLY check that
      # catches an emptied catalog: with every `// CATALOG:` line stripped, the
      # count gate above prints "OK: SSOT == fresh regen == 0 (canonical)" and
      # exits 0, while this one exits 1 with 9 problems. It also verifies the
      # named specs exist ON DISK, which is why it was written -- a glob once
      # deleted a spec while its catalog row survived, and nothing noticed.
      - name: Every catalog row still has its spec on disk
        run: |
          python3 tools/check_catalog_integrity.py

      # T86 / T85: neither gate above had ever been seen red. Both controls
      # plant faults and assert the branch by its MESSAGE, because both gates
      # reach one exit code from several branches. The integrity control also
      # runs the whole program end to end against a planted tree: its per-branch
      # cases call check() in-process, and a main() neutered to `return 0` left
      # every one of them still reporting "RED, correct branch".
      - name: Both catalog gates must go red (negative controls)
        run: |
          python3 tools/check_catalog_count.py --self-check
          python3 tools/check_catalog_integrity.py --self-check
