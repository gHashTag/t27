name: Check Now Freshness
#
# READ THE JOB ID, NOT THE FILE NAME. Despite the file name, this workflow does
# NOT check freshness: its job is `check`, and it runs
# tools/check_now_entry_shape.py, which reads an entry's SHAPE -- heading,
# bullets, well-formed name. Freshness lives in now-sync-gate.yml, whose job is
# called `check-now-freshness`. The two names are crossed. Both jobs are
# required, so neither file can be renamed without renaming a required check.
#
# The practical consequence, and it has already happened: a reader looking for
# "why did the freshness gate behave that way" opens this file, finds a shape
# checker, and concludes the freshness gate does not run.

on:
  pull_request:
    # `edited` is NOT in the default set (opened, synchronize, reopened), and the gate
    # below judges the pull request TITLE. Without it the rule fails in both directions:
    # a benign title can be renamed to `fix(rust)` after the last green run and never be
    # re-read, and an author who follows the failure message's own advice -- "name that
    # scope instead" -- edits the title and the required context stays red with no way to
    # re-run it but pushing a commit. The cost is that a body edit also re-runs this job;
    # it is python only.
    types: [opened, synchronize, reopened, edited]
    # No `branches:` filter on pull_request, deliberately. A branch filter makes
    # this gate silent on any PR whose base is not listed -- a stacked PR then
    # shows a green check list that a master-based PR would not get. Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below, where one
    # exists, is left alone: restricting post-merge runs is a cost decision.
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # THE BYPASS THAT WAS NEVER CARRIED HERE. #1081 gave `check-now-freshness` and
    # `check-linked-issue` a trusted-bot no-op on 2026-06-14, for a reason stated there:
    # a SKIPPED required check never satisfies branch protection, so the bypass has to be
    # a step that passes, not a job that is skipped. This job was exempt from the problem
    # only because its entire body was `echo "Checking repository freshness..."` -- its
    # blindness WAS the bypass. #2756 gave it real work on 2026-08-28 and the exemption
    # went with the blindness.
    #
    # MEASURED, 2026-09-06: eight open Dependabot pull requests. The three opened
    # 2026-09-01, after this job got teeth, are RED on `check` and green on the other
    # three required contexts. The five opened 2026-08-24 are green only because their
    # last run predates the change; any synchronize or title edit re-runs the job and
    # flips them. The ruleset is not editable and there are no bypass_actors, so a red
    # `check` means the pull request can never merge.
    #
    # The failure text even asserts what is false on this population: "NOW Sync Gate
    # should have caught that first" -- on a bot pull request NOW Sync Gate deliberately
    # does not look.
    env:
      IS_BOT: ${{ (github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'github-actions[bot]') && 'true' || 'false' }}
    steps:
      - name: Trusted-bot bypass (no-op pass)
        if: env.IS_BOT == 'true'
        run: |
          echo "Trusted bot PR -- gate passes as no-op. Closes 1031."

      - uses: actions/checkout@v6
        if: env.IS_BOT != 'true'
        with:
          fetch-depth: 0

      # This job's name, `check`, is one of four required by the
      # t27-master-protection ruleset. Its only step used to be
      #
      #     # Add freshness check logic here in future
      #     echo "Checking repository freshness..."
      #
      # so one of the four gates protecting master asserted nothing, and had
      # passed every pull request it ever ran on. The ruleset is not this
      # file's to edit, so the job keeps its required name and is given
      # something real to do.
      #
      # NOW Sync Gate already requires that an entry was ADDED; it does not
      # read it. The two are complementary:
      #     NOW Sync Gate  ->  "you wrote one"
      #     this           ->  "what you wrote says something"
      - name: Negative control
        if: env.IS_BOT != 'true'
        run: python3 tools/check_now_entry_shape.py --self-check

      - name: The docs/now/ entry this PR adds must say something
        if: env.IS_BOT != 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_now_entry_shape.py

      # Same shape as the two above -- a control, then the thing itself.
      #
      # #3264 merged titled `fix(rust): ... (+3)` and carried only its docs/now note;
      # the edit lived in the working tree and a `git reset --hard` destroyed it before
      # the commit. Every control that pass asked about the built binary, which was
      # correct. None asked about the commit.
      #
      # The guard was first added to `tri hooks pre-commit` (#3279) and was, that same
      # day, reachable from nothing: `core.hooksPath` unset, 0 of 148 worktrees with an
      # installed hook. It runs here so that it does not depend on what anyone installed.
      # The scope list and the extension list are READ OUT of cli/tri/src/hooks.rs, so
      # the two readers cannot drift into two rules; if they cannot be read the step
      # exits 2, which is could-not-run and not a pass.
      - name: Negative control for the fix( guard
        if: env.IS_BOT != 'true'
        run: python3 tools/check_fix_carries_source.py --self-check

      # PR_TITLE is attacker-controlled text and reaches the script through the
      # environment, never through `${{ }}` interpolation into a shell line.
      - name: A fix( in a compiler scope must carry a source file
        if: env.IS_BOT != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_fix_carries_source.py
