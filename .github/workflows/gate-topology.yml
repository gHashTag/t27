name: Gate Topology

# Checks the gates themselves rather than the code they guard.
#
# A gate with `branches: [master]` under `pull_request` does not run when a PR
# targets any other base. On a stacked PR every such gate is absent and
# `gh pr checks` prints a green list -- the green of a gate that never fired.
# Observed in this repository on 2026-08-15 on three gates at once.
#
# This workflow deliberately carries NO `branches:` filter, since a branch filter
# here would reproduce exactly the defect it exists to detect.

on:
  pull_request:
  push:
    branches: [master]
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

jobs:
  gate-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml

      - name: Merge-critical workflows must not filter pull_request by branch
        run: python3 scripts/ci/check_pr_branch_filters.py

      # A gate that does not fire is one way to get a green that means nothing;
      # a gate that fires and describes itself as deeper than it is, is another.
      # fpga-lint runs read_verilog + hierarchy and reported 32/32 on an artifact
      # iverilog compiles 4/32 (#2326). Its reach is a policy question and is
      # left alone. Its self-description is held here.
      #
      # The self-test runs first and on its own line: it asserts this checker
      # rejects the five shapes it exists to reject, including the verbatim
      # pre-change shape of fpga-build.yml. A claim gate nobody has watched fail
      # is indistinguishable from one that cannot.
      - name: fpga-lint claim gate is falsifiable (self-test)
        run: python3 scripts/ci/check_fpga_lint_claim_matches_depth.py --self-test

      - name: fpga-lint must state the depth it measures
        run: python3 scripts/ci/check_fpga_lint_claim_matches_depth.py
