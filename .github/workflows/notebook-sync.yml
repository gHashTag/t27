# NotebookLM Auto-Sync Workflow
#
# Continuous synchronization between t27 repository and NotebookLM notebooks.
# Automatically triggered on: issues, PRs, and pushes.
#
# phi^2 + 1/phi^2 = 3 | TRINITY

name: NotebookLM Auto-Sync

on:
  issues:
    types: [opened, edited, labeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, closed]
  pull_request_review:
    types: [submitted, edited]
  push:
    branches: ['feature/**', 'fix/**', 'ring-*/**', 'issue-*/**']
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to sync'
        required: true
        type: number
      sync_type:
        description: 'Type of sync'
        required: false
        type: choice
        default: 'push'
        options:
          - push
          - comment
          - activity

jobs:
  # Extract issue number from event
  extract-issue:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # This job reads untrusted event data. It gets read-only scope so that a
    # future mistake here cannot write to the repository.
    permissions:
      contents: read
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
      event_type: ${{ steps.event_type.outputs.type }}
      # issue_title was published here and consumed by nobody. It is not
      # reinstated in a sanitised form: untrusted text that no step reads is
      # best not carried at all.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Extract issue info
        id: issue
        # Every value arrives through env:, which the runner sets, so no
        # character in it can be parsed as shell. Nothing from the event is
        # interpolated into the script text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ISSUE_NUM=""
          case "$EVENT_NAME" in
            issues|issue_comment)          ISSUE_NUM="${ISSUE_NUMBER:-}" ;;
            pull_request|pull_request_review) ISSUE_NUM="${PR_NUMBER:-}" ;;
            push)
              # feature/issue-357 -> 357
              ISSUE_NUM="$(printf '%s' "${REF_NAME:-}" \
                | grep -oE '[0-9]+' | head -1 || true)"
              ;;
          esac

          # Accept only decimal digits. Downstream this number is spliced into a
          # command line, and GITHUB_OUTPUT is a newline-delimited file: a value
          # containing a newline defines additional outputs of its own choosing.
          case "$ISSUE_NUM" in
            ''|*[!0-9]*) ISSUE_NUM="" ;;
          esac

          printf 'number=%s\n' "$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      - name: Determine event type
        id: event_type
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # The action name is a closed set, so it is checked against that set
          # rather than trusted to be one of them. The check costs one case
          # statement and removes this value from the argument that has to be
          # made about the whole file.
          ACTION="unknown"
          case "${EVENT_ACTION:-}" in
            opened|edited|labeled|closed|created|synchronize|submitted)
              ACTION="$EVENT_ACTION" ;;
          esac

          EVENT_TYPE=""
          case "$EVENT_NAME" in
            issues)              EVENT_TYPE="issue_${ACTION}" ;;
            issue_comment)       EVENT_TYPE="comment" ;;
            pull_request)        EVENT_TYPE="pr_${ACTION}" ;;
            pull_request_review) EVENT_TYPE="review" ;;
            push)                EVENT_TYPE="push" ;;
          esac

          printf 'type=%s\n' "$EVENT_TYPE" >> "$GITHUB_OUTPUT"

  # Sync to NotebookLM
  sync-notebook:
    needs: extract-issue
    if: needs.extract-issue.outputs.issue_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install notebooklm-py pyyaml

      - name: Run NotebookLM sync
        env:
          ISSUE_NUM: ${{ needs.extract-issue.outputs.issue_number }}
          EVENT_TYPE: ${{ needs.extract-issue.outputs.event_type }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTION: ${{ github.event.action }}
        run: |
          cd contrib/backend/notebooklm

          # An array, not a string: a string is re-split by the shell on
          # whatever IFS happens to be, which is a second way for a value to
          # become more than one argument.
          SYNC_ARGS=(--issue "$ISSUE_NUM")

          # Determine sync type
          case "$EVENT_TYPE" in
            issue_opened|issue_edited|pr_opened|pr_synchronize|push)
              SYNC_ARGS+=(--event push)
              echo "🔄 Syncing push/PR event for issue #$ISSUE_NUM"
              ;;
            issue_closed)
              SYNC_ARGS+=(--event merge)
              echo "✨ Syncing merge (issue closed) for issue #$ISSUE_NUM"
              ;;
            comment)
              SYNC_ARGS+=(--event push --trigger comment)
              echo "💬 Syncing new comment for issue #$ISSUE_NUM"
              ;;
            pr_closed)
              SYNC_ARGS+=(--event merge --trigger merged)
              echo "🔀 Syncing PR merge for #$ISSUE_NUM"
              ;;
            *)
              echo "ℹ️  Event type $EVENT_TYPE - using default sync"
              SYNC_ARGS+=(--event push)
              ;;
          esac

          # Run sync
          python3.10 sync.py "${SYNC_ARGS[@]}" || {
            echo "⚠️  Sync completed with warnings"
            exit 0
          }

      - name: Update sync status as commit (best-effort)
        if: github.event_name == 'issues' || github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SYNC_TIME: ${{ github.event.repository.updated_at }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ needs.extract-issue.outputs.issue_number }}
        with:
          script: |
            const path = '.trinity/notebook_sync_status.json';
            const content = JSON.stringify({
              last_sync: process.env.SYNC_TIME,
              last_event: process.env.EVENT_NAME,
              last_issue: Number(process.env.ISSUE_NUM),
              synced_at: process.env.SYNC_TIME,
            }, null, 2) + '\n';
            const contentB64 = Buffer.from(content).toString('base64');

            // On 'issues' and 'pull_request' events the workflow has no
            // single canonical branch to commit to (PRs from forks have a
            // read-only token; 'issues' has no ref at all). Resolve the
            // repository's default branch and commit there as best-effort.
            const repoInfo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const branch = repoInfo.data.default_branch;

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              sha = data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            try {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: 'Update NotebookLM sync status [skip ci]',
                content: contentB64,
                branch,
                ...(sha ? { sha } : {}),
              });
              core.info(`Wrote ${path} on ${branch}`);
            } catch (e) {
              // 403/422 are expected when the workflow runs from a fork or
              // when branch protection blocks the write. This step is a
              // book-keeping nicety, not a correctness gate — log and pass.
              core.warning(`Status commit skipped (${e.status} ${e.message})`);
            }

  # Sync activity.md periodically
  sync-activity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Check if activity.md changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^activity.md$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: pip install notebooklm-py

      - name: Sync activity.md
        if: steps.check.outputs.changed == 'true'
        run: |
          python3.10 contrib/backend/notebooklm/sync.py --activity || true

  # Manual sync workflow_dispatch
  manual-sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install notebooklm-py pyyaml

      - name: Run manual sync
        env:
          ISSUE_NUM: ${{ inputs.issue_number }}
          SYNC_TYPE: ${{ inputs.sync_type }}
        run: |
          cd contrib/backend/notebooklm

          # An array, not a string: a string is re-split by the shell on
          # whatever IFS happens to be, which is a second way for a value to
          # become more than one argument.
          SYNC_ARGS=(--issue "$ISSUE_NUM")

          case "$SYNC_TYPE" in
            comment)
              SYNC_ARGS+=(--event push --trigger comment)
              ;;
            activity)
              # Replaces the array rather than appending to it: --activity is
              # documented as standalone, and the original assignment here
              # discarded --issue too.
              SYNC_ARGS=(--activity)
              ;;
            *)
              SYNC_ARGS+=(--event push)
              ;;
          esac

          python3.10 sync.py "${SYNC_ARGS[@]}"

      - name: Comment on issue (optional)
        if: inputs.sync_type == 'activity'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.inputs.issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📊 Activity.md has been synced to NotebookLM'
            })
