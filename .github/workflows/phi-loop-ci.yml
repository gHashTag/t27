name: PHI Loop CI

on:
  pull_request:
    # No `branches:` filter on pull_request, deliberately. A branch filter makes
    # this gate silent on any PR whose base is not listed -- a stacked PR then
    # shows a green check list that a master-based PR would not get. Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below, where one
    # exists, is left alone: restricting post-merge runs is a cost decision.
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

jobs:
  phi-loop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: PHI Loop identity check
        run: |
          echo "PHI Loop CI: L5 identity invariant verification"
          echo "phi^2 + phi^-2 = 3 (IEEE f64 tolerance)"
          python3 -c "phi = (1.0 + 5.0**0.5) / 2.0; identity = phi**2 + phi**(-2); assert abs(identity - 3.0) < 1e-10; print('L5 PASSED')"

      - name: FPGA-Safety lint
        run: |
          # The pipeline used to end `&& echo L8 FAILED && exit 1 || echo L8 PASSED`
          # with `2>/dev/null` on the first grep. Two failures were therefore
          # indistinguishable from a clean tree: `ffi/src/` renamed or removed
          # sends grep to exit 2 with its message discarded, and the LAST grep in
          # the pipe then sees empty input and exits 1, which the `||` reads as
          # "no violations". Verified: pointing the same pipeline at a directory
          # that does not exist prints `L8 PASSED` and exits 0.
          if [ ! -d ffi/src ]; then
            echo "::error::ffi/src/ is missing -- nothing was checked." >&2
            exit 2
          fi
          if RAW=$(grep -rn 'as f64' ffi/src/ --include='*.rs'); then rc=0; else rc=$?; fi
          case "$rc" in
            0)
              HITS=$(printf '%s\n' "$RAW" | grep -v 'to_bits\|from_bits\|FPGA-ALLOWED' | grep -v '//.*f32\|//.*f64') || true
              if [ -n "$HITS" ]; then
                printf '%s\n' "$HITS"
                echo "L8 FAILED" >&2
                exit 1
              fi
              echo "L8 PASSED (every 'as f64' under ffi/src/ is an allowed form)"
              ;;
            1)
              echo "L8 PASSED (no 'as f64' under ffi/src/)"
              ;;
            *)
              echo "::error::grep exited $rc. Nothing was checked." >&2
              exit 2
              ;;
          esac
