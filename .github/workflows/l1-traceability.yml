name: L1 TRACEABILITY Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:

jobs:
  check-traceability:
    name: Check L1 TRACEABILITY
    runs-on: ubuntu-latest
    # Closes #1031: trusted bots (Dependabot) PASS this required gate as a no-op
    # instead of SKIPPING it. A skipped required check never satisfies branch
    # protection, so the job must RUN and conclude success. We detect the bot via
    # both the trigger actor and the PR author login (the latter survives a human
    # 'Update branch') and short-circuit the substantive steps.
    env:
      IS_BOT: ${{ (github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'github-actions[bot]') && 'true' || 'false' }}
    steps:
      - name: Trusted-bot bypass (no-op pass)
        if: env.IS_BOT == 'true'
        run: |
          echo "Trusted bot PR -- gate passes as no-op. Closes 1031."

      - name: Checkout repository
        if: env.IS_BOT != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for Closes #N in commits
        if: env.IS_BOT != 'true'
        id: check-commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e

          # Get the base branch (master or main)
          BASE_BRANCH="${BASE_REF:-master}"
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE_BRANCH="master"
          fi

          echo "Checking commits against $BASE_BRANCH..."

          # Get commit hashes in the range, excluding merge commits
          COMMIT_HASHES=$(git log origin/"$BASE_BRANCH"..HEAD --format="%H" --no-merges 2>/dev/null || echo "")

          if [ -z "$COMMIT_HASHES" ]; then
            echo "No commits to check (likely first push)"
            exit 0
          fi

          # Check each commit for Closes #N pattern (in full message)
          FAILED=0
          FAILED_COMMITS=""
          TOTAL=0
          PASSED=0

          while IFS= read -r hash; do
            if [ -z "$hash" ]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))

            # Get the full commit message
            FULL_MSG=$(git log -1 --format="%B" "$hash")
            SHORT_MSG=$(git log -1 --format="%h %s" "$hash")

            # Check for issue reference in full message.
            # Accept any standard GitHub linking keyword:
            #   Close(s)/Fix(es)/Resolve(s) — closes the issue on merge
            #   Refs/Ref — references an issue (work in progress on same epic)
            #   Updates/Update — progress update on an existing issue
            # Also accept "#N" anywhere on a line that contains one of these verbs.
            if ! echo "$FULL_MSG" | grep -qiE "(Closes?|Fixes?|Resolves?|Refs?|Updates?)\s*#[0-9]+"; then
              FAILED=1
              FAILED_COMMITS="$FAILED_COMMITS  ❌ $SHORT_MSG"$'\n'
            else
              PASSED=$((PASSED + 1))
              echo "  ✓ $SHORT_MSG"
            fi
          done <<< "$COMMIT_HASHES"

          echo ""
          echo "Summary: $PASSED/$TOTAL commits pass L1 TRACEABILITY"

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "::error::L1 TRACEABILITY VIOLATION: The following commits are missing issue references:"
            echo "$FAILED_COMMITS"
            echo ""
            echo "L1 TRACEABILITY: No code merged without Closes #N"
            echo "Please add issue references to your commits."
            exit 1
          fi

      - name: Check L2 GENERATION (gen/ edits forbidden)
        if: env.IS_BOT != 'true'
        id: check-generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e

          # Get the base branch
          BASE_BRANCH="${BASE_REF:-master}"

          # For PR, use the PR head SHA directly instead of HEAD (which is a merge commit)
          if [ "${EVENT_NAME:-}" = "pull_request" ]; then
            HEAD_SHA="${PR_HEAD_SHA:-}"
            case "$HEAD_SHA" in
              *[!0-9a-f]*|"") echo "unexpected head sha; skipping fetch"; HEAD_SHA="HEAD" ;;
              *)
                # PR_HEAD_REF is the fork's branch name and is chosen by whoever
                # opened the PR. git permits $ ( ) ` ; | & and quotes in a
                # refname, so it is validated before use, and rejected if it
                # could be read as an option rather than a ref.
                if git check-ref-format --branch "${PR_HEAD_REF:-}" >/dev/null 2>&1 \
                   && case "${PR_HEAD_REF:-}" in -*) false ;; *) true ;; esac; then
                  git fetch origin "${PR_HEAD_REF}:${HEAD_SHA}" 2>/dev/null || true
                else
                  echo "refusing to fetch a ref name that does not validate: skipping"
                fi
                ;;
            esac
          else
            HEAD_SHA="HEAD"
          fi

          echo "Checking for gen/ directory edits..."

          # Check if any existing files in gen/ were modified (not new additions)
          # Use --no-renames to avoid false positives from rename detection
          MODIFIED_GEN=$(git diff --no-renames --name-status origin/"$BASE_BRANCH".."$HEAD_SHA" 2>/dev/null | grep -E "^M\s+gen/" || echo "")
          if [ -n "$MODIFIED_GEN" ]; then
            echo "::error::L2 GENERATION VIOLATION: The following files under gen/ were modified directly:"
            echo "$MODIFIED_GEN"
            echo "Edit specs instead and regenerate using './scripts/tri gen'"
            exit 1
          fi

          echo "  ✓ No gen/ edits detected (new files allowed)"

      - name: Check L3 PURITY (ASCII-only identifiers)
        if: env.IS_BOT != 'true'
        id: check-purity
        run: |
          set -e

          echo "Checking L3 PURITY (ASCII-only source files)..."

          # Find non-ASCII characters in source files
          if git diff origin/"$BASE_BRANCH"..HEAD --name-only | xargs grep -P '[^\x00-\x7F]' 2>/dev/null | head -20; then
            echo ""
            echo "::warning::L3 PURITY WARNING: Non-ASCII characters detected in source files."
            echo "L3 PURITY: Source files must be ASCII-only with English identifiers."
            # Warning only, not blocking
          else
            echo "  ✓ All source files are ASCII"
          fi

  summary:
    name: L1 Traceability Summary
    if: always()
    needs: check-traceability
    runs-on: ubuntu-latest
    steps:
      - name: Print Summary
        run: |
          echo "### L1 TRACEABILITY Check Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check-traceability.result }}" = "success" ]; then
            echo "✅ All commits comply with L1 TRACEABILITY" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.check-traceability.result }}" = "skipped" ]; then
            echo "⏭️ L1 TRACEABILITY check skipped (trusted bot actor)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ L1 TRACEABILITY violations detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the failed job logs above." >> $GITHUB_STEP_SUMMARY
          fi
