[workspace]
resolver = "2"
members = ["bootstrap", "cli/tri", "cli/trios-bridge", "cli/flash-spi", "cli/dlc10"]
# `ffi` was in NEITHER members nor exclude, so `cargo publish` in it failed on
# manifest load -- "current package believes it's in a workspace when it's not"
# -- before it could reach a registry. That is why the crates.io leg of the
# release pipeline could never run.
exclude = ["bindings/javascript", "bindings/python", "tools/converter", "gen", "ffi", "rings"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
