[package]
name = "trios-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "trios-bridge"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
dirs = "5"
gethostname = "1.1"

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
