[package]
name = "t27-wasm-explorer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The bootstrap compiler, compiled to WebAssembly, so a browser can read a .t27 spec the way the CLI does"

# The artifact this crate exists to produce is `t27_wasm_explorer.wasm`, loaded
# by apps/website/src/lib/t27Compiler.ts. Build it with:
#
#   cargo build -p t27-wasm-explorer --release --target wasm32-unknown-unknown
#
# This crate is in the workspace's `exclude` list beside bindings/javascript and
# bindings/python: it is a cdylib for one non-host target, and building it for
# the host on every `cargo build --workspace` buys nothing.
[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
