[build-system]
requires = ["maturin>=1.0,<2.0", "toml", "typing"]
build-backend = "maturin"

[project]
name = "golden-float"
version = "1.0.0"
description = "Phi-structured floating-point formats for ML and scientific computing"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Trinity S3AI", email = "t27@trinity-s3ai.org" }
]
keywords = ["golden-float", "phi", "floating-point", "ml", "numpy", "ternary", "t27"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
test = ["pytest"]
torch = ["torch"]

[project.urls]
Homepage = "https://trinity-s3ai.org"
Documentation = "https://trinity-s3ai.org/docs/"
Repository = "https://github.com/trinity-s3ai/t27"

[tool.maturin]
python-source = "python"
module-name = "golden_float._core"
